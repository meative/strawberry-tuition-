 --bg:#0f1420; --panel:#19202f; --panel2:#1f2738; --line:#2e384c; --line2:#3c4760;
 --ink:#e4e9f2; --mut:#8a96ac; --leaf:#5b8def; --leaf2:#7aa6f5; --leafsoft:#1a2336;
 --berry:#f06595; --berry2:#ff85ad; --berrysoft:#2a1a26; --gold:#e8c547; --goldsoft:#2a2613;
 --cream:#eef2f8; --shadow:rgba(0,0,0,.55); --rowalt:#1d2536;
 --chip:#1f2738; --headbg:#0a0e18; --headtxt:#e4e9f2; --yellow:#3a3410;

*{box-sizing:border-box;margin:0;padding:0;}
/* 本文ゴシックは端末標準（iPad/Mac＝ヒラギノ角ゴ、Win＝メイリオ/游ゴシック）。Webフォント取得ゼロ。 */
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Meiryo",sans-serif;background:var(--bg);color:var(--ink);
 transition:background .4s,color .4s;min-height:100vh;
 background-image:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--leaf2) 8%,transparent),transparent 42%),
  radial-gradient(circle at 88% 92%,color-mix(in srgb,var(--berry) 6%,transparent),transparent 46%);}
.app{max-width:1280px;margin:0 auto;padding:0 18px 70px;}
header{padding:26px 0 18px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;}
h1{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:25px;letter-spacing:.04em;color:var(--ink);}
.tagline{font-size:11px;color:var(--mut);letter-spacing:.24em;text-transform:uppercase;margin-top:4px;}
.theme-tog{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--panel);
 border:1px solid var(--line);border-radius:30px;padding:6px 8px;box-shadow:0 6px 18px -10px var(--shadow);}
.theme-tog button{border:none;background:transparent;cursor:pointer;font-size:13px;padding:7px 14px;
 border-radius:20px;color:var(--mut);font-family:inherit;font-weight:700;transition:.2s;}
.theme-tog{flex-wrap:wrap;max-width:560px;justify-content:flex-end;}
.theme-tog button.on{background:var(--leaf);color:#fff;}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
 background:linear-gradient(150deg,var(--panel),var(--panel2));border:1px solid var(--line);
 border-radius:18px;padding:18px 22px;box-shadow:0 18px 44px -26px var(--shadow);margin-bottom:18px;}
.fld{display:flex;flex-direction:column;gap:6px;}
.fld label{font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;font-weight:700;}
select{font-family:inherit;background:var(--panel);border:1.5px solid var(--line2);color:var(--ink);
 padding:10px 14px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.2s;}
select:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 22%,transparent);}
.park-sel{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:17px;color:var(--leaf);min-width:210px;}
.stats{display:flex;gap:11px;margin-left:auto;flex-wrap:wrap;}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px 18px;text-align:right;min-width:118px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--leaf);}
.stat.berry::before{background:var(--berry);} .stat.gold::before{background:var(--gold);}
.stat .k{font-size:9.5px;letter-spacing:.13em;color:var(--mut);text-transform:uppercase;font-weight:700;}
.stat .v{font-family:"Spline Sans Mono",monospace;font-size:20px;font-weight:700;color:var(--ink);margin-top:2px;}
.stat .v small{font-size:11px;color:var(--mut);font-weight:500;}
.stat.berry .v{color:var(--berry);} .stat.gold .v{color:var(--gold);}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-1px;position:relative;z-index:2;}
.tab{padding:10px 15px;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:11px 11px 0 0;
 background:var(--chip);color:var(--mut);border:1px solid var(--line);border-bottom:none;transition:.2s;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--leaf);}
.tab.active{background:var(--panel);color:var(--leaf);box-shadow:0 -3px 0 var(--leaf) inset;}
.tab .mini{font-size:8.5px;background:var(--berry);color:#fff;padding:1px 6px;border-radius:8px;letter-spacing:.03em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0 16px 16px 16px;
 box-shadow:0 20px 50px -30px var(--shadow);overflow:hidden;}
.card-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.card-head h2{font-family:"Zen Old Mincho",serif;font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;}
.card-head h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--berry);box-shadow:0 0 9px var(--berry);}
.card-head .meta{font-size:12px;color:var(--mut);margin-left:auto;}
.tablewrap{overflow:auto;max-height:62vh;}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
th{position:sticky;top:0;background:var(--headbg);color:var(--headtxt);font-size:10px;letter-spacing:.08em;
 text-transform:uppercase;font-weight:700;padding:12px 13px;text-align:left;white-space:nowrap;z-index:3;}
th.r{text-align:right;}
td{padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;}
tbody tr:nth-child(even) td{background:var(--rowalt);}
tbody tr:hover td{background:color-mix(in srgb,var(--leaf) 8%,transparent);}
.name{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:15px;color:var(--ink);}
.cls{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--leaf);letter-spacing:.03em;}
.waku{font-size:12.5px;color:var(--mut);} .koza{font-size:12.5px;color:var(--mut);}
.num{font-family:"Spline Sans Mono",monospace;text-align:right;font-weight:600;color:var(--ink);}
.num.total{color:var(--leaf);font-size:15px;font-weight:700;}
.num.minus{color:var(--berry);} .num.zero{color:var(--mut);font-weight:400;}
.ptag{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;letter-spacing:.03em;display:inline-block;}
.pt-月寒園{background:#e8f0e9;color:#3d7355;}
.pt-白石園{background:#eef0f5;color:#4a5a82;}
.pt-サッポロファクトリー園{background:#f7e7ec;color:#a8466a;}
.pt-幼稚舎{background:#f5ecdc;color:#9a6b2f;}
.pt-資生館保育園{background:#ece7f2;color:#6a548c;}
[data-theme="dark"] .pt-月寒園,[data-theme="midnight"] .pt-月寒園,[data-theme="mocha"] .pt-月寒園{background:#1d3326;color:#7cc99a;}
[data-theme="dark"] .pt-白石園,[data-theme="midnight"] .pt-白石園,[data-theme="mocha"] .pt-白石園{background:#1f2740;color:#8fa6d8;}
[data-theme="dark"] .pt-サッポロファクトリー園,[data-theme="midnight"] .pt-サッポロファクトリー園,[data-theme="mocha"] .pt-サッポロファクトリー園{background:#3a1f2a;color:#e88aa8;}
[data-theme="dark"] .pt-幼稚舎,[data-theme="midnight"] .pt-幼稚舎,[data-theme="mocha"] .pt-幼稚舎{background:#3a2e1a;color:#e0b46a;}
[data-theme="dark"] .pt-資生館保育園,[data-theme="midnight"] .pt-資生館保育園,[data-theme="mocha"] .pt-資生館保育園{background:#2a2438;color:#b59ad8;}
.flagdot{color:var(--berry);font-weight:700;font-size:15px;}
tr.changed td{background:color-mix(in srgb,var(--gold) 14%,transparent)!important;}
tr.changed:hover td{background:color-mix(in srgb,var(--gold) 22%,transparent)!important;}
.chgmark{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em;margin-right:6px;}
.reason{font-size:11px;color:var(--berry);}
[contenteditable]{cursor:text;border-radius:5px;}
[contenteditable]:focus{outline:2px solid var(--leaf);outline-offset:1px;background:color-mix(in srgb,var(--leaf) 10%,transparent);}
.inp{font-family:inherit;background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:7px 9px;border-radius:8px;font-size:13px;width:100%;}
.inp:focus{outline:none;border-color:var(--leaf);}
/* 年間スケジュールの「年」入力欄（.nospin）だけ number スピナーを消す。4桁の西暦を切らずに表示するため。他の数字入力欄には影響しない */
.nospin{-moz-appearance:textfield;appearance:textfield;}
.nospin::-webkit-inner-spin-button,.nospin::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0;}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center;}
.btn{font-family:inherit;font-weight:700;font-size:14px;border:none;padding:13px 26px;border-radius:12px;
 cursor:pointer;letter-spacing:.03em;transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:linear-gradient(120deg,var(--leaf),var(--leaf2));color:#fff;box-shadow:0 12px 26px -12px var(--leaf);}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2);}
.hint{font-size:12px;color:var(--mut);line-height:1.7;margin-top:14px;}
.editbadge{font-size:11px;color:var(--gold);font-weight:700;}
/* settings panel */
.setgrid{padding:20px 22px;display:grid;gap:22px;}
.setblock h3{font-family:"Zen Old Mincho",serif;font-size:15px;color:var(--leaf);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.bankcol th:first-child{text-align:left;}
.yellow{background:var(--yellow);}
/* PDF preview */
.pdfpaper{background:var(--cream);color:#1a1a1a;max-width:600px;margin:22px auto;padding:40px 46px;
 border-radius:8px;box-shadow:0 20px 50px -20px var(--shadow);font-family:"Zen Old Mincho",serif;line-height:1.9;}
[data-theme="dark"] .pdfpaper{color:#1a1a1a;}
.pdfpaper h3{text-align:center;font-size:20px;letter-spacing:.3em;margin:18px 0;border-bottom:2px solid #2f6b46;padding-bottom:10px;}
.pdfpaper .sec{font-weight:700;color:#2f6b46;border-left:4px solid #2f6b46;padding-left:8px;margin:18px 0 8px;}
.pdfpaper table{font-family:inherit;font-size:13px;}
.pdfpaper td{border:none;padding:5px 8px;color:#333;background:none!important;}
.readme{padding:22px 26px;font-size:13.5px;line-height:1.95;white-space:pre-wrap;}
.readme b{color:var(--leaf);}
.foot{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.05em;margin-top:34px;}
/* ===== JPEG保存（印刷用）のA4化 =====
   JPEG保存は「A4の紙をそのまま画像にしたもの」を出力する。
   画面用の案内書（幅780px・縦長）をそのまま画像化すると、A4より縦長の比率になり、
   写真アプリから印刷したときにA4の中央へ小さく配置され、余白だらけになっていた。
   そこで、画面外に用意した「A4サイズの台紙」（794×1123px＝A4 96dpi換算、内側余白9mm）に
   案内書の“複製”を貼り、その台紙ごと画像化する（原本のDOMは一切動かさない）。
   .a4-fit は、印刷時と同じ圧縮（余白・行間を詰めてA4 1枚に収める）を画像化のときにも効かせるためのクラス。
   画面表示・印刷CSSには一切影響しない（この class が付くのは画面外の複製だけ）。 */
.a4-fit{margin:0!important;width:100%!important;max-width:100%!important;box-shadow:none!important;border:none!important;font-size:12px!important;}
.a4-fit::after{display:none!important;}
.a4-fit .topbar{padding:6px 40px 5px!important;}
.a4-fit .brandJP{font-size:13px!important;}
.a4-fit .issuedate{margin-top:4px!important;font-size:11px!important;}
.a4-fit .titlewrap{padding:6px 40px 4px!important;}
.a4-fit .titleEN{margin-bottom:6px!important;font-size:9px!important;}
.a4-fit .titleJP{font-size:19px!important;letter-spacing:.36em!important;}
.a4-fit .titleline{margin-top:6px!important;}
.a4-fit .body{padding:0 40px 6px!important;}
.a4-fit .addr{font-size:15px!important;margin:6px 0 2px!important;}
.a4-fit .greet{font-size:11.5px!important;line-height:1.6!important;margin:6px 0 10px!important;}
.a4-fit .sec2{margin:9px 0 4px!important;}
.a4-fit .sec2 .lbl{font-size:13px!important;}
.a4-fit .info{gap:4px 24px!important;font-size:12px!important;}
.a4-fit .info dd b{font-size:14px!important;}
.a4-fit .billtable td{padding:4px 10px!important;font-size:12px!important;line-height:1.3!important;}
.a4-fit .billtotal{padding:6px 10px 2px!important;margin-top:3px!important;}
.a4-fit .billtotal .lbl{font-size:13px!important;}
.a4-fit .billtotal .amt{font-size:22px!important;}
.a4-fit .bankcard{padding:9px 20px!important;gap:5px 20px!important;font-size:12px!important;margin-top:8px!important;}

/* 印刷の隔離方式（重要）
   ・旧々方式：アプリ全体を visibility:hidden → 高さが残るので空白ページが出る。
   ・旧方式（不具合）：書類ノードを非表示コンテナへ「移動」→ iPad Safari は afterprint を
     発火しないため書類が戻らず、画面から消え、JPEG保存も 0サイズ要素の画像化で失敗した。
   ・現方式：DOMは一切動かさず、印刷時だけクラスを付けて CSS で隔離する。
     印刷対象の祖先だけを表示（.print-anc）、その兄弟は display:none で消す。
     ＝レイアウトごと消えるので空白ページも出ない。
     クラスは @media print の中でしか意味を持たないため、万一クラスが残っても画面は無傷。 */
@media print{
 @page{size:A4;margin:9mm;}
 /* 用紙の高さ計算を狂わせないよう、ルート要素の余白・スクロール枠を無効化（Safari対策） */
 html,body{margin:0!important;padding:0!important;height:auto!important;min-height:0!important;overflow:visible!important;background:#fff!important;}
 /* iOS Safari は印刷時に本文を自動拡大（text inflation）することがあり、
    それだけで案内書がA4からわずかにはみ出して2ページ目ができる。必ず無効化する。 */
 html{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important;}
 /* ①body直下を全部消す → ②印刷対象の祖先だけ復活 → ③その祖先の他の子を消す → ④対象を表示 */
 body.printing-doc > *{display:none!important;}
 body.printing-doc .print-anc{display:block!important;}
 body.printing-doc .print-anc > *{display:none!important;}
 body.printing-doc .print-anc > .print-anc,
 body.printing-doc .print-anc > .print-target{display:block!important;}
 /* 祖先（.app / .card / #body など）が持つ余白・枠・影・幅制限・スクロール枠を印刷時だけ無効化。

 body.printing-doc .print-anc{margin:0!important;padding:0!important;border:none!important;background:none!important;box-shadow:none!important;
   width:auto!important;max-width:none!important;min-height:0!important;height:auto!important;overflow:visible!important;position:static!important;float:none!important;}
 body.printing-doc .print-target{display:block!important;margin:0!important;width:100%!important;max-width:100%!important;box-shadow:none!important;border:none!important;
   position:static!important;overflow:visible!important;}
 .noprint{display:none!important;}
 /* Safari（iPad/Mac）は既定で背景色・背景グラデーションを印刷しない。
    施設カラーバー・口座欄の背景・振込期限の枠を紙に出すために明示指定する。 */
 body.printing-doc .print-target,body.printing-doc .print-target *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
 /* 印刷時は端末内蔵の明朝（iPad/Mac＝ヒラギノ明朝、Win＝游明朝）を使う。

// ===== 端末判定：iOS / iPadOS か =====
// iPad・iPhone の Safari は「Webサイトからの自動印刷」をブロックし、window.print() を呼ぶと
// 「このWebサイトから自動的に印刷することは禁止されています」と出て実用的に印刷できない。
// そのため iOS では印刷ボタンを出さず、JPEG保存に一本化する（画像を保存 → 写真アプリから印刷）。
// ・iPhone / iPod / 旧iPad：userAgent に iPhone / iPad / iPod が入る。
// ・iPadOS 13以降：Safariが「Mac」を名乗るため userAgent では判別できない。
//   platform==='MacIntel' かつ タッチ対応（maxTouchPoints>1）で iPad と判定する。
//   Mac のデスクトップ（Chrome/Safari）は maxTouchPoints が 0 なので「非iOS」となる。
const IS_IOS = (function(){
 try{
  const ua=navigator.userAgent||'';
  if(/iPad|iPhone|iPod/.test(ua))return true;
  const plat=navigator.platform||'';
  const touch=Number(navigator.maxTouchPoints||0);
  return (plat==='MacIntel'||plat==='iPad'||plat==='iPhone') && touch>1; // iPadOS 13+ の「Macを名乗るSafari」
 }catch(e){ return false; }
})();

function canCapture(el){

// 発行日・振込期限・給食記録の既定日はすべてローカル日付から組み立てる。
function ymdLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function parseYMD(s){ // 'YYYY-MM-DD' をローカル日付として解釈（Safariでも安全）
 const m=String(s||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 return m ? new Date(+m[1],+m[2]-1,+m[3]) : new Date(s);
}

function ymKey(){return yy+'-'+mm;}
// 前月の年月キー（1月の前は前年12月）
function prevYmKey(){let py=yy,pm=mm-1;if(pm<1){pm=12;py=yy-1;}return py+'-'+pm;}
// イベント出納帳：前月から繰り越されたイベント予算の残金（当園）。なければ0。
// 前月のイベント出納帳が「翌月へ繰り越す」で締められていれば、その eventCarry を当月の開始繰越金とする。
function cbEventCarryIn(){
 const pk=park;const pkey=prevYmKey();
 const prev=cashbookEvent[pk]&&cashbookEvent[pk][pkey];
 if(!prev)return 0;
 // 前月が締め済み（繰越行 or 締め行あり）で eventCarry>0 のときのみ繰り越す
 const closed=(prev.rows||[]).some(r=>r.isClose);
 return closed?(Number(prev.eventCarry)||0):0;
}
function logChange(name,field,label,fromVal,toVal){
 const k=ymKey();
 if(!changeLog[k])changeLog[k]={};
 if(!changeLog[k][name])changeLog[k][name]=[];
 let arr=changeLog[k][name];
 // 同じfieldの既存ログは置き換え
 arr=arr.filter(x=>x.field!==field);
 // 基準値（rosterBase）と同じに戻ったら記録しない
 const base=rosterBase.find(x=>x.name===name);
 const baseVal=base?base[field]:undefined;
 if(toVal!==baseVal){arr.push({field,label,from:baseVal,to:toVal});}
 changeLog[k][name]=arr;
 if(arr.length===0)delete changeLog[k][name];
}

const STORE_KEY='sf_tuition_v1';

// ユーザー編集の localStorage 書き込みがまだ済んでいない間 true。
// リモート受信側が「この端末は編集直後だ」と判断するために使う（__cloudDirty が
// 自分の書き込みエコーで消されても、こちらは残るので取りこぼさない）。
let __pendingUserSave=false;
// 保存対象データ（savedAt を含まない＝内容の同一判定に使える形）を1か所で組み立てる
function stateForSave(){
 return {v:1,

function saveState(){ // 入力データをまとめて端末に保存（連打防止のため少し遅延）
 // 【変更】render() は画面を描き直すたびに saveState() を呼ぶため、
 //   「タブを切り替えただけ」「初回案内PDFを表示しただけ」でも
 //   毎回クラウドへ全データ（最大1MB）を送信していた。
 //   内容が前回保存時とまったく同じなら、保存もクラウド送信も行わない。
 //   ＝データが1文字でも変われば JSON が変わるので、保存漏れは起きない。
 const json=JSON.stringify(stateForSave());
 if(json===__lastSavedJson) return; // 無変更：端末保存もクラウド送信もしない
 __lastSavedJson=json;

 if(__saveTimer)clearTimeout(__saveTimer);
 const skipCloud = !!window.__applyingRemote; // リモート反映中の保存はクラウドへ送り返さない
 // 編集中フラグはデバウンスの外で即座に立てる。
 // タイマーの中で立てると、編集してから 300ms の間 __cloudDirty が false のままになり、
 // その隙に他端末の更新を受けると showConflict を通らず静かに上書きされる。
 if(!skipCloud){
  __pendingUserSave=true;
  if(typeof cloudMarkDirty==='function') cloudMarkDirty();
 }
 __saveTimer=setTimeout(()=>{
  __saveTimer=null;
  try{
   const data=stateForSave();
   data.savedAt=new Date().toISOString();
   localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(e){console.warn('保存に失敗:',e);}
  if(!skipCloud) __pendingUserSave=false;
 },300);
}

  if(d.roster)roster=d.roster;
  if(d.changeLog)changeLog=d.changeLog;
  if(d.lookmeeCheck)lookmeeCheck=d.lookmeeCheck;

  if(d.bank)bank=d.bank;

  if(d.cashbook)cashbook=d.cashbook;if(d.cashbookEvent)cashbookEvent=d.cashbookEvent;if(d.cashbookExtra)cashbookExtra=d.cashbookExtra;if(d.timelyData)timelyData=d.timelyData;
  if(d.addons)addons=d.addons;
  if(d.sched)sched=d.sched;
  if(typeof d.schedMemo==='string')schedMemo=d.schedMemo;
  if(d.meals)meals=d.meals;

 }catch(e){console.warn('復元に失敗:',e);return false;}

// ===== 計算ロジック（3体系対応：A保育園 / B幼稚舎 / C資生館）=====
function facType(name){const f=M.facilities.find(x=>x.name===name);return f?f.type:'A';}
function hasSibling(p){return p.sib==='あり';} // グループ全体判定（兄弟ありフラグで表現）
// 兄弟割引の対象枠：地域系のみ（地域枠・旧地域枠・地域無償化）。企業提携枠・旧企業提携枠・従業員(自社/グループ会社)系は対象外。
function sibDiscountOK(w){ return w==='地域枠'||w==='旧地域枠'||w==='地域無償化'; }
// 手数料抜き（売上）金額＝請求合計−「実際に入っている手数料(c.fee)」。110が入っている園だけ差引く（資生館は手数料なし→差引かない＝請求額のまま）。
function feeExcl(c){ if(!c) return 0; return (c.total||0)-(c.fee||0); }
function schedKey(s){ return [s.year,s.month,s.item,s.cls,s.pupil||''].join('|'); } // 行事の識別（金額は含めない）
function gardenAmt(pk,s){ const m=schedAmounts[pk]; const v=m?m[schedKey(s)]:undefined; return (v!=null&&v!=='')?(Number(v)||0):(Number(s.fix)||0); } // 全社行事の「この園の金額」（未設定なら本部の既定）
function allSched(){ // 全社カレンダー(schedShared:行事は本部管理・金額は園別)＋この園の予定(sched) を重複排除で合成
 const seen=new Set(), out=[];
 (schedShared||[]).forEach(s=>{const k=schedKey(s);if(!seen.has(k)){seen.add(k);out.push(Object.assign({},s,{_shared:true}));}});
 (sched||[]).forEach(s=>{const k=schedKey(s);if(!seen.has(k)){seen.add(k);out.push(s);}});
 return out;
}
function eventsFor(p){let out=[];allSched().forEach(s=>{
 if(s.state!=='確定'||s.year!=yy||s.month!=mm)return;const amt=s._shared?gardenAmt(p.park,s):(Number(s.fix)||0);if(!amt)return;
 // 除外園児に含まれていればスキップ
 if(s.exclude&&s.exclude.includes(p.name))return;
 let hit=false;
 if(s.cls==='全員'||s.cls==='全園')hit=true;
 else if(s.cls==='個別'){if((s.pupil||'').trim()===p.name.trim())hit=true;}
 else if(M.facilities.some(f=>f.name===s.cls)){if(s.cls===p.park)hit=true;} // 施設対象（幼稚舎など）
 else if(s.cls===p.cls)hit=true;
 if(hit)out.push({item:s.item,amt});});return out;}
// 追加申込み行が課税（単体購入の制服）かどうか。制服商品かつ taxMode==='single' のときのみ課税。
function addonIsTaxable(a){
 const g=M.goods.find(x=>x.name===a.goods);
 const isUni=g && g.cat==='制服';
 return !!(isUni && a.taxMode==='single');
}
function addonsFor(p){return addons.filter(a=>a.name===p.name&&+a.ry===yy&&+a.rm===mm).map(a=>{
 const raw=(a.price||0)*(a.qty||1);
 const isRefund=a.kind==='返金';
 return {item:(isRefund?'返金:':'')+(a.goods||'項目'),amt:isRefund?-Math.abs(raw):raw,addonTaxable:addonIsTaxable(a)};});}
// 給食実費（幼稚舎・末締め翌末払い）：対象年月の請求には「前月」の利用を集計して乗せる
function prevMonth(y,m){return m===1?{y:y-1,m:12}:{y:y,m:m-1};}
function mealsFor(p){
 if(facType(p.park)!=='B')return null; // 幼稚舎のみ
 const pm=prevMonth(yy,mm); const tag=pm.y+'-'+('0'+pm.m).slice(-2);
 let lunch=0,bread=0;
 meals.forEach(r=>{ if(r.name===p.name && r.date.startsWith(tag)){ if(r.lunch)lunch++; if(r.bread)bread++; }});
 const amt=lunch*M.mealfee.lunch+bread*M.mealfee.bread;
 return {lunch,bread,amt,tag:pm.y+'年'+pm.m+'月分'};
}

// 台帳オプション（園児ごとのあり・なし）の月額合計。施設の体系で対象が異なる
function optionsFor(p){

  if(p.optEncho){bItems.push({item:'延長',amt:Y.encho||0});bAmt+=Y.encho||0;}
  return {items:bItems,amt:bAmt};
 }
 if(t==='A' && p.optMattress){items.push({item:'マットレス',amt:O.mattress});amt+=O.mattress;} // 保育園3園のみ
 if(t==='C'){ // 資生館のみ：おむつサブスク・制服レンタル
  if(p.optDiaper){items.push({item:'おむつサブスク',amt:O.diaper});amt+=O.diaper;}
  if(p.optKnit){items.push({item:'制服ﾚﾝﾀﾙ:ニット',amt:O.uniform.knit});amt+=O.uniform.knit;}

  if(p.optParka){items.push({item:'制服ﾚﾝﾀﾙ:パーカー',amt:O.uniform.parka});amt+=O.uniform.parka;}
 }

function classByBirth(birth,yy){

 // 「年度の4月1日終了時点で何歳か」を計算（4月1日が誕生日の子は前年度扱い）
 const b=new Date(birth);

 // 実務的には「4月1日時点で満N歳」=「年度開始時点で満N歳」

let sortMode='ageAsc'; // ageAsc(年齢順 0歳→年長) / ageDesc(年長→0歳) / kana(五十音) / regist(登録順) / class(クラス順)

function visible(){

 if(sortMode==='regist')return list; // 登録順（並び替えなし）

  // 全施設のときは施設ごとにまとめる
  if(park==='全施設'){
   const pa=M.facilities.findIndex(f=>f.name===a.park);
   const pb=M.facilities.findIndex(f=>f.name===b.park);
   if(pa!==pb)return pa-pb;
  }
  if(sortMode==='kana'){

  }

function cashbookGuardOn(store){ // 指定の出納帳ストアで、入力済みなのに担当未設定の行を返す

   const months=store[pk]||{};

     const rows=m.rows||[];
     if((Number(m.opening)||0)>0&&!m.openingBy)bad.push(`${pk} ${k} 本部から振替`);
     rows.forEach((r,i)=>{
       const hasContent=(Number(r.amt)||0)>0||r.acct||r.item;
       if(hasContent&&!r.by)bad.push(`${pk} ${k} No.${i+1}`);
     });
   });
 });
 return bad.length?bad:null;
}

// ===== 年度収支まとめ（本部集計）=====
// 会計年度：4月〜翌3月。yy/mm から対象年度を算出（1〜3月は前年が年度）
function hqFiscalYearOf(y,m){ return (m>=4)?y:(y-1); }
function hqCurFY(){ return hqFiscalYearOf(yy,mm); }
// 年度の月順（4,5,…,12,1,2,3）と、その月が属する暦年を返す
function hqFyMonths(fy){
 const arr=[];
 for(let m=4;m<=12;m++)arr.push({m,cy:fy});
 for(let m=1;m<=3;m++)arr.push({m,cy:fy+1});
 return arr;
}
// 年度収支データ：施設×月の {income, expense}（収入＝新規入園振込＋タイムリー現金、支出＝通常経費＋イベント費）
function hqFiscalData(fy){
 const allpks=['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'];
 const months=hqFyMonths(fy);
 // 施設別・月別の器を用意：cell[park][monthIndex] = {shokai,timely,exp,evexp}
 const data={};
 allpks.forEach(p=>{data[p]=months.map(()=>({shokai:0,timely:0,exp:0,evexp:0}));});
 // 月インデックスの逆引き：'cy-m' → index
 const idxOf={};
 months.forEach((mo,i)=>{idxOf[mo.cy+'-'+mo.m]=i;});
 // ① 新規入園（振込）：initSaleLog の paidDate（入金日）の年月で配賦
 roster.filter(r=>r.isNew&&r.name).forEach(p=>{
  const log=initSaleLog[p.name];
  if(!log||!log.paid||!log.paidDate)return;
  const m=String(log.paidDate).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return;
  const cy=+m[1],cm=+m[2];
  const idx=idxOf[cy+'-'+cm];if(idx==null)return;
  if(!data[p.park])return;
  const amt=initSaleAmount(p);if(!(amt>0))return;
  data[p.park][idx].shokai+=amt;
 });
 // ② タイムリー（現金）／③ 通常経費／④ イベント費：[施設][cy-cm] キーで拾う
 allpks.forEach(p=>{
  months.forEach((mo,i)=>{
   const key=mo.cy+'-'+mo.m;
   // タイムリー現金売上
   const tl=(timelyData[p]&&timelyData[p][key])||[];
   tl.forEach(r=>{data[p][i].timely+=Number(r.amt)||0;});
   // 通常経費（出金）：本部振替・現金補充・締めの預金振替は除外
   const cb=(cashbook[p]&&cashbook[p][key]);
   if(cb&&Array.isArray(cb.rows)){
    cb.rows.forEach(r=>{if(r.kind==='out'&&!r.isClose)data[p][i].exp+=Number(r.amt)||0;});
   }
   // イベント費（出金）：締め行・繰越行は除外
   const ev=(cashbookEvent[p]&&cashbookEvent[p][key]);
   if(ev&&Array.isArray(ev.rows)){
    ev.rows.forEach(r=>{if(r.kind==='out'&&!r.isClose)data[p][i].evexp+=Number(r.amt)||0;});
   }
  });
 });
 return {fy,months,data,parks:allpks};
}
// ===== 消費税区分の集計（会計士確認用）=====
// 当月（yy/mm）の請求を施設別に課税（制服代）／非課税（月謝・保育料等）／行事その他に分ける
function hqTaxBreakdown(y,m){
 const allpks=['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'];
 const savedY=yy,savedM=mm;yy=y;mm=m; // calc/addonsFor が参照するグローバルを一時切替
 const res={};
 allpks.forEach(p=>{res[p]={taxable:0,nontaxUni:0,nontax:0,other:0,total:0};});
 allPupils().forEach(r=>{
  if(!res[r.park])return;
  const c=calc(r);
  if(!(r.status==='在園中'||c.isNew)||c.taienStopped)return;
  // 非課税：月謝・保育料・付帯費・割引・日割り・手数料・早期割引
  const nontax=c.getsu+c.kyozai+c.sib+c.half+(c.early||0)+c.fee;
  res[r.park].nontax+=nontax;
  res[r.park].total+=c.total;
  // 課税＝単体購入の制服（addonTaxable）のみ。月謝と一括の制服・レンタル・初回オプションは非課税（制服）。
  // それ以外（行事費・用品等）は「行事/その他」。
  c.evs.forEach(e=>{
   if(e.addonTaxable){ res[r.park].taxable+=e.amt; }          // 単体購入の制服＝課税
   else if(isUniform(e.item)){ res[r.park].nontaxUni+=e.amt; } // 月謝一括・レンタル等の制服＝非課税（制服）
   else { res[r.park].other+=e.amt; }                          // 行事費・その他用品
  });
 });
 yy=savedY;mm=savedM; // 復元
 return res;
}
// 年度（4月〜翌3月）の月別 課税売上（制服代）と非課税売上を施設別に集計
function hqTaxByMonth(fy){
 const allpks=['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'];
 const months=hqFyMonths(fy);
 const data={};
 allpks.forEach(p=>{data[p]=months.map(()=>({taxable:0,nontaxUni:0,nontax:0,other:0}));});
 months.forEach((mo,i)=>{
  const bd=hqTaxBreakdown(mo.cy,mo.m);
  allpks.forEach(p=>{data[p][i]={taxable:bd[p].taxable,nontaxUni:bd[p].nontaxUni,nontax:bd[p].nontax,other:bd[p].other};});
 });
 return {fy,months,data,parks:allpks};
}

function zenToHanDigits(s){ // 全角数字 ０-９(U+FF10-FF19) → 半角 0-9

 s=s.replace(/[^0-9]/g,''); // カンマ・空白・¥・記号・日本語・マイナスを除去＝非負

}

}

 });
 // 日付順（月→日の数値順）に並べる
 const dnum=s=>{const m=String(s.date||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?(+m[2])*100+(+m[3]):9999;};

}

function salesRowsForPark(pk){
 // タイムリー：プレビュー内で読み込んだ timelyData[施設][対象月]
 const out=[];
 const k=ymKey();
 const tl=(timelyData[pk]&&timelyData[pk][k])?timelyData[pk][k]:[];
 tl.forEach(r=>{out.push({mon:r.mon||mm,day:r.day||'',kind:'現金',item:r.item||'',amt:Number(r.amt)||0,by:r.by||'',park:pk});});
 // 新規入園：初回売上管理で入金済み・入金日が対象年月の園児
 roster.filter(r=>r.isNew&&r.name&&r.park===pk).forEach(p=>{
   const log=initSaleLog[p.name];if(!log||!log.paid)return;
   const m=String(log.paidDate||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!m)return;
   if(+m[1]!==yy||+m[2]!==mm)return;
   const amt=initSaleAmount(p);if(amt<=0)return;
   out.push({mon:+m[2],day:+m[3],kind:'振込',item:`新規入園 ${p.name} 初回月謝`,amt:amt,by:(STAFF.includes(log.by)?log.by:''),park:pk});
 });
 // 日付順
 out.sort((a,b)=>(a.day||0)-(b.day||0));
 return out;
}

// CSVテキストを行配列にパース（ダブルクオート対応・BOM除去）
function parseCsv(text){
 text=text.replace(/^\ufeff/,'');
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
   if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
   else{ if(c==='"')q=true;
     else if(c===','){row.push(cur);cur='';}
     else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
     else if(c==='\r'){}
     else cur+=c; }
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

// タイムリー(一時預かり)CSVの取込。列名の揺れに強くし、0件時は理由を具体的に表示する。
// タイムリー「明細CSV」列：利用日,来園時刻,退園時刻,氏名,クラス,区分,基本料金,延長料金,合計,受領者,領収書番号,お伝え事項,備考
// タイムリー「日別サマリーCSV」列：日付,利用者数,合計 ほか
function importTimelyCsv(text){
 const rows=parseCsv(text);
 if(rows.length<2){infoDialog('CSVにデータが見つかりませんでした。','取込できません');return;}
 const head=rows[0].map(h=>String(h).replace(/^﻿/,'').trim());
 const idxAny=names=>{for(const n of names){const i=head.findIndex(h=>h===n);if(i>=0)return i;}return -1;};
 // 列名エイリアス（タイムリー側の列名が多少変わっても拾えるように）
 const ai=idxAny(['合計','合計金額','金額','料金','利用料金','売上','売上金額','総額']);
 const di=idxAny(['利用日','日付','ご利用日','利用年月日']);
 const ni=idxAny(['氏名','お名前','お子さま氏名','お子様氏名','園児名','名前']);
 const ci=idxAny(['利用者数','人数','件数','利用人数']);
 const ki=idxAny(['区分','利用区分','種別']);
 const ri=idxAny(['受領者','担当','受付','担当者','受付者']);
 const bi=idxAny(['領収書番号','領収No','領収No.','受付番号','受付No']);
 if(ai<0){ infoDialog('金額の列（「合計」など）が見つかりませんでした。\n\n読み込んだ見出し：\n'+head.join(' / ')+'\n\nタイムリーの「明細CSV」か「日別サマリーCSV」を選んでください。','取込できません'); return; }
 if(di<0){ infoDialog('日付の列（「利用日」または「日付」）が見つかりませんでした。\n\n読み込んだ見出し：\n'+head.join(' / '),'取込できません'); return; }
 const isDetail=(ni>=0||bi>=0);
 const added=[];let noDate=0,zeroAmt=0;const skMonths={};
 rows.slice(1).forEach(r=>{
   const d=cbParseDate(r[di]);const amt=Number(String(r[ai]||'').replace(/[^\d.-]/g,''))||0;
   if(!d){noDate++;return;}
   if(d.mon!==mm){skMonths[d.mon]=(skMonths[d.mon]||0)+1;return;}
   if(amt<=0){zeroAmt++;return;}
   if(isDetail){
     const nm=ni>=0?String(r[ni]||'').trim():'';
     const kb=ki>=0?String(r[ki]||'').trim():'';
     const rno=bi>=0?String(r[bi]||'').trim():'';
     const rcv=ri>=0?String(r[ri]||'').trim():'';
     added.push({mon:d.mon,day:d.day,item:`タイムリースクール ${nm}${kb?`（${kb}）`:''}${rno?` 領収No.${rno}`:''}`,amt:amt,by:STAFF.includes(rcv)?rcv:''});
   }else{
     const cnt=ci>=0?(Number(String(r[ci]||'').replace(/[^\d.-]/g,''))||0):0;
     added.push({mon:d.mon,day:d.day,item:`タイムリースクール ${d.mon}/${d.day}分${cnt?`（利用${cnt}名）`:''}`,amt:amt,by:''});
   }
 });
 if(added.length===0){
   const months=Object.keys(skMonths).map(Number).sort((a,b)=>a-b);
   const why=[];
   if(months.length) why.push(`対象月（${mm}月）以外のデータが ${months.reduce((s,m)=>s+skMonths[m],0)}件（CSVは ${months.map(m=>m+'月').join('・')} のデータ）→ 上部の「対象月」を ${months[0]}月 に合わせてください`);
   if(zeroAmt) why.push(`金額が0または空の行が ${zeroAmt}件（金額列＝「${head[ai]}」）`);
   if(noDate) why.push(`日付が読めない行が ${noDate}件（日付列＝「${head[di]}」）`);
   infoDialog('取り込めるデータがありませんでした。\n\n'+(why.length?('内訳：\n・'+why.join('\n・')):'対象月のデータが見つかりませんでした。上部の対象年月をご確認ください。'),'取込できません');return;
 }
 const skTotal=Object.values(skMonths).reduce((s,n)=>s+n,0);
 const skMsg=skTotal?`\n（対象月以外の ${skTotal} 件は除外）`:'';
 const total=added.reduce((s,r)=>s+r.amt,0);
 confirmDialog(
   `タイムリースクールの現金売上 ${added.length} 件・合計 ¥${total.toLocaleString()} を取り込みます。${skMsg}\n\n※ 同じ月に再度読み込むと、前回分は置き換えられます。`,
   ()=>{ const store=cbTimelyGet(); store.length=0; store.push(...added); saveState(); cbShowPreview(); },
   'タイムリースクールCSVの取込','取り込む'
 );
}

function downloadCsv(filename, rows){

}

function render(){

 // 案A：再描画（body.innerHTML の作り直し）でスクロール位置が最上部へ飛ぶのを防ぐ。

 //  全箇所（入力ハンドラ・タブ切替・onSnapshot によるクラウド受信など）に一括で効く。
 const __scEl=document.scrollingElement||document.documentElement;
 const __winTop=(__scEl&&__scEl.scrollTop)||window.scrollY||0; // ウィンドウ全体のスクロール量

 // 復元：innerHTML 差し替えで .tablewrap は新要素に置き換わっているので、index 対応で書き戻す。
 const __restoreScroll=()=>{
  const __tws=document.querySelectorAll('.tablewrap');
  for(let __k=0;__k<__tws.length&&__k<__twTops.length;__k++) __tws[__k].scrollTop=__twTops[__k];
  if(__scEl) __scEl.scrollTop=__winTop;
  if(window.scrollY!==__winTop) window.scrollTo(0,__winTop);
 };
 __restoreScroll(); // まず即時に復元（innerHTML 代入でレイアウトは確定済み）

}

// 顧客番号を半角に正規化（全角英数→半角、空白・カンマ除去）。北海道銀行は半角必須。
function normFurikaeNo(s){
 return String(s||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[\s,、，]/g,'').trim();

// 北海道銀行ビジネスWEB「口座振替請求」用CSVを出力。表示中の園・引落の園児のみ。
// 形式：顧客番号,引落金額（見出し無し・半角数字・3桁コンマ無し・カンマ区切り・BOM無し・CRLF）。
function exportHokkaidoFurikaeCsv(){
 if(park==='全施設'){ infoDialog('口座振替CSVは園ごとに作成します。\n\n上部の「施設」で対象の園を選んでから出力してください。','園を選んでください'); return; }
 const list=allPupils().filter(r=>r.park===park && !(r.isNew&&!r.confirmed));
 const byNo=new Map(); const cntNo=new Map(); const order=[]; const noNo=[]; let furikomi=0;
 list.forEach(r=>{
   const amt=(calc(r).total)||0;
   if(amt<=0) return;                              // 退園・対象外は除外
   if(payMethod(r)==='振込'){ furikomi++; return; }  // 振込は口座振替の対象外
   const no=normFurikaeNo(r.furikaeNo);
   if(!no){ noNo.push(r.name||'(名前未入力)'); return; }
   // 同じ顧客番号（兄弟など）は1行に合算：道銀の金額ファイルは1顧客番号＝1行が基本
   if(byNo.has(no)){ byNo.set(no,byNo.get(no)+amt); cntNo.set(no,cntNo.get(no)+1); }
   else { byNo.set(no,amt); cntNo.set(no,1); order.push(no); }
 });
 const lines=order.map(no=>no+','+byNo.get(no)); // 顧客番号ごとに1行（初出順・金額は合算済み）
 if(!lines.length){
   const ex=noNo.length?`\n\n※ 引落対象で顧客番号が未入力：${noNo.length}名（${noNo.slice(0,12).join('、')}${noNo.length>12?' ほか':''}）`:'';
   infoDialog(`出力できる引落データがありませんでした。${ex}\n\n園児台帳の「顧客番号」欄と、対象年月・園をご確認ください。`,'出力できません'); return;
 }
 const body=lines.join('\r\n')+'\r\n';
 const blob=new Blob([body],{type:'text/csv'}); // BOM無し（データは半角数字とカンマのみ）
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download=`口座振替_北海道銀行_${park}_${yy}年${('0'+mm).slice(-2)}月.csv`;a.click();URL.revokeObjectURL(url);
 const total=order.reduce((s,no)=>s+byNo.get(no),0);
 const combinedNos=order.filter(no=>cntNo.get(no)>1);
 const combinedPupils=combinedNos.reduce((s,no)=>s+cntNo.get(no),0);
 let msg=`口座振替CSVを出力しました。\n\n・口座数（行数）：${lines.length}件\n・合計引落額：¥${total.toLocaleString()}\n・形式：顧客番号,引落金額（見出し無し・半角・カンマ区切り）`;
 if(combinedNos.length) msg+=`\n\n👨‍👩‍👧 同じ顧客番号を合算：${combinedNos.length}口座（園児${combinedPupils}名分を各1行にまとめました）`;
 if(noNo.length) msg+=`\n\n⚠ 顧客番号が未入力のため除外：${noNo.length}名\n（${noNo.slice(0,12).join('、')}${noNo.length>12?' ほか':''}）\n園児台帳で番号を入れて再出力してください。`;
 if(furikomi) msg+=`\n\n（振込の ${furikomi}名は口座振替の対象外です）`;
 msg+=`\n\n北海道銀行ビジネスWEB「口座振替請求」→「振込データの新規作成」→金額ファイルの取込 で読み込んでください。`;
 infoDialog(msg,'口座振替CSV 出力完了');
}

function aggregateSlices(snaps){ // 全園スライスを1つのメモリ内stateへ統合（本部集計・税区分の閲覧用）
 const out={ v:1, roster:[], rosterBase:[], bank:[], reissueFeeByPark:{}, cashbook:{}, cashbookEvent:{}, cashbookExtra:{}, timelyData:{}, changeLog:{}, lookmeeCheck:{}, initSaleLog:{}, addons:[], meals:[], sched:[], schedMemo:'', shops:[], schedAmounts:{} };
 snaps.forEach(s=>{ if(!s||!s.exists) return; let p; try{p=JSON.parse(s.data().payload||'{}');}catch(e){ return; }
  out.roster=out.roster.concat(p.roster||[]);
  out.rosterBase=out.rosterBase.concat(p.rosterBase||[]);
  if((!out.bank||!out.bank.length)&&p.bank&&p.bank.length) out.bank=p.bank;
  Object.assign(out.reissueFeeByPark, p.reissueFeeByPark||{});
  Object.assign(out.cashbook, p.cashbook||{});
  Object.assign(out.cashbookEvent, p.cashbookEvent||{});
  Object.assign(out.cashbookExtra, p.cashbookExtra||{});
  Object.assign(out.timelyData, p.timelyData||{});
  ['changeLog','lookmeeCheck'].forEach(K=>{ const src=p[K]||{}; for(const ym in src){ out[K][ym]=Object.assign(out[K][ym]||{}, src[ym]); } });
  Object.assign(out.initSaleLog, p.initSaleLog||{});
  out.addons=out.addons.concat(p.addons||[]);
  out.meals=out.meals.concat(p.meals||[]);
  if((!out.sched||!out.sched.length)&&p.sched&&p.sched.length) out.sched=p.sched;
  if(!out.schedMemo&&p.schedMemo) out.schedMemo=p.schedMemo;
  (p.shops||[]).forEach(s=>{ if(!out.shops.includes(s)) out.shops.push(s); });
  Object.assign(out.schedAmounts, p.schedAmounts||{});
 });
 return out;
}

// 【混入防止・根本修正】園別ドキュメントへ保存する内容を「その園ぶんだけ」に絞る。
//   全施設集計や別園の内容がメモリに残っていても、保存内容には絶対に混ざらない（＝別園データの混入を原理的に不可能にする）。
//   移行時（園ID分離）と同じスライス方法。元のメモリは壊さないよう必ずディープコピーしてから絞る。
function sliceForGarden(src, G){
 if(!G) return src;
 const d=JSON.parse(JSON.stringify(src));
 const inP=r=>r&&r.park===G;
 d.roster=(d.roster||[]).filter(inP);
 d.rosterBase=(d.rosterBase||[]).filter(inP);
 const names=new Set(d.roster.map(r=>r.name));
 const pickG=o=>{const r={}; if(o&&o[G]!==undefined) r[G]=o[G]; return r;};
 const ymByName=log=>{const out={}; for(const ym in (log||{})){const inner=log[ym]||{},keep={}; for(const nm in inner) if(names.has(nm)) keep[nm]=inner[nm]; if(Object.keys(keep).length) out[ym]=keep;} return out;};
 const byName=o=>{const out={}; for(const nm in (o||{})) if(names.has(nm)) out[nm]=o[nm]; return out;};
 d.cashbook=pickG(d.cashbook);
 d.cashbookEvent=pickG(d.cashbookEvent);
 d.cashbookExtra=pickG(d.cashbookExtra);
 d.timelyData=pickG(d.timelyData);
 d.reissueFeeByPark=pickG(d.reissueFeeByPark);
 d.schedAmounts=pickG(d.schedAmounts);
 d.changeLog=ymByName(d.changeLog);
 d.lookmeeCheck=ymByName(d.lookmeeCheck);
 d.initSaleLog=byName(d.initSaleLog);
 d.addons=(d.addons||[]).filter(a=>a&&names.has(a.name));
 d.meals=(d.meals||[]).filter(m=>m&&names.has(m.name));
 // bank / sched / schedMemo / shops は全社共通に近いためそのまま
 return d;
}

 if(d.initSaleLog)initSaleLog=d.initSaleLog;
 if(d.cashbook)cashbook=d.cashbook;if(d.cashbookEvent)cashbookEvent=d.cashbookEvent;if(d.cashbookExtra)cashbookExtra=d.cashbookExtra;if(d.timelyData)timelyData=d.timelyData;

 if(!email||!pass){if(err)err.textContent='メールアドレスとパスワードを入力してください。';return;}
 if(typeof firebase==='undefined'||!firebase.auth){if(err)err.textContent='サーバーに接続できません（Firebase未読み込み）。ページを再読み込みしてから、もう一度お試しください。';return;}
 const btn=document.getElementById('loginBtn'); if(btn){btn.disabled=true; btn.textContent='ログイン中…';}
 firebase.auth().signInWithEmailAndPassword(email,pass)
  .catch(e=>{
    const c=(e&&e.code)||'';
    let m;
    if(c==='auth/too-many-requests') m='ログイン失敗が続いたため、一時的にロックされています。パスワード自体は合っている可能性があります。しばらく（数十分）待ってから再度お試しいただくか、パスワードを再設定してください。';
    else if(c==='auth/wrong-password'||c==='auth/invalid-credential') m='パスワードが違います。（全角スペースの混入や大文字・小文字にご注意ください。目のアイコンで入力内容を確認できます）';
    else if(c==='auth/user-not-found') m='このメールアドレスは登録されていません。';
    else if(c==='auth/invalid-email') m='メールアドレスの形式が正しくありません。';
    else if(c==='auth/network-request-failed') m='通信エラーです。ネットワーク接続をご確認のうえ、もう一度お試しください。';
    else m='ログインできませんでした（'+(c||e.message)+'）';
    if(err)err.textContent=m;
    if(btn){btn.disabled=false; btn.textContent='ログイン';}
  });
}

    `<button id="operAdd" style="margin-top:12px;width:100%;padding:9px 12px;border:1px dashed var(--line2);background:var(--panel2);color:var(--leaf);border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">＋ 新しい担当者を追加</button>`;
  document.querySelectorAll('#operExtra .operPick').forEach(b=>{b.onclick=()=>{
    const v=b.dataset.name; currentOperator=v; localStorage.setItem('sf_operator',v); cloudBarRender(); close(); if(typeof then==='function')then();
  };});
  document.querySelectorAll('#operExtra .operDel').forEach(b=>{b.onclick=()=>{
    const nm=b.dataset.name;
    if(STAFF.length<=1){ infoDialog('担当者は最低1人必要です。最後の1人は削除できません。','削除できません'); return; }
    requireAdminPin(()=>{
      confirmDialog(`${nm}さんを担当者から削除しますか？`,()=>{
        const idx=STAFF.indexOf(nm); if(idx>=0)STAFF.splice(idx,1); saveStaffList(); if(typeof saveState==='function')saveState();
        if(currentOperator===nm){currentOperator='';localStorage.removeItem('sf_operator');cloudBarRender();}
        draw();
      },'担当者の削除','削除する');
    });
  };});
  document.getElementById('operAdd').onclick=()=>{ requireAdminPin(()=>{ promptStaffName(()=>draw()); }); };
 };
 document.getElementById('operTitle').textContent='担当者の確認';
 document.getElementById('operMsg').textContent='あなたのお名前を選んでください。\n（クラウドの「最終更新者」として記録されます）';
 ov.style.display='flex';
 ov.onclick=e=>{if(e.target===ov)close();};
 draw();
}

// --- 同期本体 ---
function loadShared(){ // 全社共通データ（現状：年間スケジュール schedShared）を shared/global から読込
 if(!cloudDB) return;
 cloudDB.collection('shared').doc('global').get().then(snap=>{
  if(!snap.exists) return;
  let d; try{ d=JSON.parse(snap.data().payload||'{}'); }catch(e){ return; }
  if(Array.isArray(d.schedShared)) schedShared=d.schedShared;
  if(typeof render==='function') render();
 }).catch(e=>{ console.warn('shared読込失敗',e); });
}
function onSignedIn(){
 hideLogin();
 loadShared();
 const begin=()=> IS_HONBU ? switchHonbuGarden(park||'全施設') : startCloudSync();
 if(!currentOperator){ askOperator(begin); } else { begin(); }
}
function startCloudSync(){
 if(window.__cloudSubbed)return; window.__cloudSubbed=true;
 cloudBarSet('connecting');
 __cloudUnsub = cloudRef().onSnapshot({includeMetadataChanges:true},snap=>{
  cloudReady=true;
  if(!snap.exists){ if(CURRENT_GARDEN){ cloudBarSet('error','この園のデータが未作成です（移行前）'); return; } cloudPushNow(); return; } // クラウド未作成→ローカルを種まき（園別は移行前の誤上書きを防ぐ）
  if(snap.metadata.hasPendingWrites){ cloudBarSet('saving'); return; } // 自分の未確定書き込み
  const data=snap.data();
  if(data.updatedAt) __lastRemote={by:data.updatedBy||'',at:data.updatedAt.toDate()};
  // 自分の更新が確定（自分の保存エコー）。ただし送信後に新しい編集が入っていれば dirty は落とさない。
  // ★園を切り替えた直後（この購読でまだ一度も反映していない）は、自分の端末が最後に保存した園でも
  //   必ず中身を反映する。そうしないと前の園の表示が残り「切り替えても最新にならない」ため。
  if(data.deviceId===MY_DEVICE && __syncApplied){ if(__editSeq===__pushedSeq){__cloudDirty=false;} cloudBarSet('synced'); return; }
  const payload=parsePayload(data);
  // __pendingUserSave も見る。自分の書き込みエコー（上の分岐）で __cloudDirty が
  // 落ちた直後に他端末の更新が届くと、編集直後なのに「編集中でない」と誤判定されるため。
  if(!__cloudDirty && !__pendingUserSave){ // 自分は編集中でない→そのまま反映
   window.__applyingRemote=true; if(payload){cloudApplyObject(payload);render();} window.__applyingRemote=false;
   __syncApplied=true; // この園の中身を反映済み（以降は自分の保存エコーを再反映しない）
   cloudBarSet('synced');
  } else { // 編集中に他端末が更新→自分の入力は保持し、静かに知らせるだけ（次の保存で自分の内容が反映される）
   cloudNotice('他の端末でも更新がありました。あなたの入力はそのまま残しています（このまま保存すると反映されます）。');
  }
 }, err=>{ console.error('onSnapshot error',err); cloudBarSet('error','接続エラー'); });
}
function cloudMarkDirty(){
 __editSeq++; // cloudReady 前の編集も数える（起動直後の編集を取りこぼさない）
 if(!cloudReady)return;
 __cloudDirty=true; cloudBarSet('dirty');
 if(__pushTimer)clearTimeout(__pushTimer);
 __pushTimer=setTimeout(cloudPushNow,1200);
}
function cloudPushNow(){
 if(AGG_READONLY) return; // 本部・全施設は閲覧専用（クラウドへ書き込まない）
 if(!cloudDB)return;
 // 【誤上書き防止ガード】園別ドキュメントには「その園の園児だけ」を書き込む。
 //   園の切替直後など、メモリがまだ前の園（別園）の内容のまま push されると、
 //   別園データや空データでその園を上書きしてしまう。該当する場合は保存を中止する。
 if(CURRENT_GARDEN){
  if(!cloudReady){ cloudBarSet('dirty'); return; } // 新しい園の初回受信前は保存しない（前の園のメモリを書かない）
  var __expPark=GARDEN_TO_PARK[CURRENT_GARDEN];
  var __rs=roster||[];
  var __foreign=__rs.some(function(r){ return r && r.park && r.park!==__expPark; });
  if(__foreign || __rs.length===0){
   console.warn('⚠ 誤上書き防止：gardens/'+CURRENT_GARDEN+'（'+__expPark+'）へ '+(__rs.length===0?'空の名簿':'別園の名簿')+' を書き込もうとしたため中止しました。画面を再取得してください。');
   __cloudDirty=false; if(__pushTimer){clearTimeout(__pushTimer);__pushTimer=null;} cloudBarSet('synced'); return;
  }
 }
 cloudBarSet('saving');
 const seq=__editSeq; // この番号の状態を送る
 // 園別ドキュメントへは「その園ぶんだけ」に絞って保存（別園データの混入を根本から防ぐ）
 var __save=cloudStateObject();
 if(CURRENT_GARDEN){ __save=sliceForGarden(__save, GARDEN_TO_PARK[CURRENT_GARDEN]); }
 const json=JSON.stringify(__save);
 if(json.length>950000) console.warn('クラウド保存データが大きくなっています（'+json.length+'字）。1MB上限に注意。');
 __pushedSeq=seq;
 cloudRef().set({ payload:json, updatedBy:currentOperator||'(不明)', deviceId:MY_DEVICE,
   updatedAt:firebase.firestore.FieldValue.serverTimestamp(), clientTime:new Date().toISOString() })
  // 送信中に新しい編集が入っていたら dirty のままにする（次の push で送る）
  .then(()=>{ if(__editSeq===seq) __cloudDirty=false; })
  .catch(e=>{ console.error('クラウド保存失敗',e); cloudBarSet('error','保存失敗'); });
}
function cloudManualRefresh(){
 loadShared();
 if(AGG_READONLY){ honbuAggregateLoad(); return; } // 全施設は再集計
 if(!cloudDB){return;}
 cloudBarSet('connecting','取得中…');
 cloudRef().get().then(snap=>{
  if(!snap.exists){ cloudBarSet('synced'); return; }
  const data=snap.data(); const payload=parsePayload(data);
  if(data.updatedAt) __lastRemote={by:data.updatedBy||'',at:data.updatedAt.toDate()};
  window.__applyingRemote=true; if(payload){cloudApplyObject(payload);render();} window.__applyingRemote=false;
  // 手動で最新を取得＝ローカルの編集は破棄。保存待ちフラグも畳む（残すと以降ずっと衝突扱いになる）
  __cloudDirty=false; __pendingUserSave=false; __pushedSeq=__editSeq; cloudBarSet('synced');
 }).catch(e=>{ cloudBarSet('error','取得失敗'); });
}
// 非ブロッキングの小さな通知（数秒で自動的に消える）。編集中に他端末の更新が届いた時に、
// 画面を止めずに知らせるためのもの。※以前の「どちらを残しますか？」モーダルの置き換え。
function cloudNotice(msg){
 var el=document.getElementById('cloudNotice');
 if(!el){ el=document.createElement('div'); el.id='cloudNotice';
  el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:10034;background:#3d7355;color:#fff;border-radius:12px;padding:11px 18px;box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:520px;width:90%;font-family:inherit;font-size:13px;line-height:1.6;text-align:center';
  document.body.appendChild(el); }
 el.textContent=msg;
 el.style.display='block';
 if(el.__t)clearTimeout(el.__t);
 el.__t=setTimeout(function(){ el.style.display='none'; },5000);
}
function showConflict(data,payload){
 let el=document.getElementById('cloudConflict');
 if(!el){ el=document.createElement('div'); el.id='cloudConflict';
  el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:10035;background:#7a2540;color:#fff;border-radius:14px;padding:15px 20px;box-shadow:0 10px 36px rgba(0,0,0,.35);max-width:560px;width:92%;font-family:inherit';
  document.body.appendChild(el); }
 const who=data.updatedBy||'他の端末';
 const when=data.updatedAt?data.updatedAt.toDate().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'';
 el.innerHTML=`<div style="font-weight:700;margin-bottom:6px">⚠ ${who}さんがクラウドを更新しました${when?'（'+when+'）':''}</div>`+
  `<div style="font-size:13px;line-height:1.7;margin-bottom:12px">あなたも編集中です。どちらを残しますか？</div>`+
  `<div style="display:flex;gap:10px;flex-wrap:wrap">`+
   `<button id="cfTake" style="padding:9px 16px;border:none;border-radius:20px;background:#fff;color:#7a2540;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px">最新を読み込む（自分の変更を破棄）</button>`+
   `<button id="cfKeep" style="padding:9px 16px;border:1px solid #fff;border-radius:20px;background:transparent;color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px">自分の変更を優先（上書き保存）</button>`+
  `</div>`;
 el.style.display='block';
 document.getElementById('cfTake').onclick=()=>{ window.__applyingRemote=true; if(payload){cloudApplyObject(payload);render();} window.__applyingRemote=false; __cloudDirty=false; __pendingUserSave=false; __pushedSeq=__editSeq; el.style.display='none'; cloudBarSet('synced'); };
 document.getElementById('cfKeep').onclick=()=>{ el.style.display='none'; cloudPushNow(); };
}
// ログイン画面のUI配線（ボタン・Enterキー・目のアイコン）。Firebaseの成否と無関係に必ず実行する。
// ※以前はこの配線がFirebase初期化の成功後（typeof firebase チェックの内側）にあり、
//   SDKが読めない環境ではボタンも目のアイコンも一切反応しない不具合になっていた。
function wireLoginUI(){
 const lb=document.getElementById('loginBtn'); if(lb)lb.onclick=doLogin;
 ['loginEmail','loginPass'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')doLogin();});});
 // パスワード表示/非表示トグル（目のアイコン）。入力ミス（全角混入など）を目視確認するため。
 const pt=document.getElementById('loginPassToggle');
 if(pt)pt.onclick=()=>{
   const inp=document.getElementById('loginPass'); if(!inp) return;
   const show=inp.type==='password';
   inp.type=show?'text':'password';
   pt.textContent=show?'🙈':'👁';
   const lbl=show?'パスワードを隠す':'パスワードを表示';
   pt.title=lbl; pt.setAttribute('aria-label',lbl);
   inp.focus();
 };
}
function cloudInit(){
 wireLoginUI(); // ← Firebaseが読めなくてもボタン・目のアイコンは動くよう、先に必ず配線する
 if(typeof firebase==='undefined'){
   cloudBarSet('error','SDK読込失敗（オフライン？）');
   const err=document.getElementById('loginErr'); if(err)err.textContent='サーバーに接続できません（Firebaseを読み込めませんでした）。通信環境をご確認のうえ、ページを再読み込みしてください。';
   return;
 }
 try{
  firebase.initializeApp(firebaseConfig);
  cloudDB=firebase.firestore();
  firebase.auth().onAuthStateChanged(user=>{ if(user){ const em=((user.email||'').trim().toLowerCase()); CURRENT_GARDEN=EMAIL_TO_GARDEN[em]||null; IS_HONBU=(em==='honbu@strawberry.com'); if(IS_HONBU){ applyHonbuSetup(); } else { applyGardenLock(); } onSignedIn(); } else { CURRENT_GARDEN=null; IS_HONBU=false; showLogin(); } });
 }catch(e){ console.error('Firebase初期化失敗',e); cloudBarSet('error','初期化エラー'); const err=document.getElementById('loginErr'); if(err)err.textContent='初期化エラー：'+((e&&e.message)||e)+'（ページを再読み込みしてください）'; showLogin(); }
}
cloudInit();
</script></body></html>
