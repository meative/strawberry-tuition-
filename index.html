<style>
:root,[data-theme="garden"]{

 --berry:#c2185b; --berry2:#e8417a; --berrysoft:#f9e3ea; --gold:#b8860b; --goldsoft:#f6edd4;
 --cream:#fffdf8; --shadow:rgba(90,70,40,.16); --rowalt:#faf4e8;
 --chip:#f2e9d8; --headbg:#5a4632; --headtxt:#fdf8ec; --yellow:#fff2c4;

 --ink:#403525; --mut:#917f64; --leaf:#a9784a; --leaf2:#c79a68; --leafsoft:#f1e5d2;
 --berry:#bf5a6a; --berry2:#d97f8c; --berrysoft:#f6e5e6; --gold:#bb8b3a; --goldsoft:#f5ecd5;
 --cream:#fffaf2; --shadow:rgba(100,75,45,.16); --rowalt:#f8f0e2;
 --chip:#f0e6d3; --headbg:#604a33; --headtxt:#fdf7ec; --yellow:#ffefbc;
}
/* クリーム系② ハニー：黄み・蜂蜜トーンで明るい */
[data-theme="honey"]{
 --bg:#faf3df; --panel:#fffdf6; --panel2:#fbf5e3; --line:#ecdfbe; --line2:#dccd9e;
 --ink:#42371f; --mut:#998a5e; --leaf:#a6802a; --leaf2:#c99f44; --leafsoft:#f5ecce;
 --berry:#c2185b; --berry2:#e8417a; --berrysoft:#f9e3ea; --gold:#b8860b; --goldsoft:#f6edcf;
 --cream:#fffdf6; --shadow:rgba(110,90,40,.16); --rowalt:#fbf4e1;
 --chip:#f5ebcf; --headbg:#5e4e22; --headtxt:#fdfae8; --yellow:#fff0b8;
}
/* クリーム系③ ローズベージュ：苺をやや前に出した上品系 */
[data-theme="rose"]{
 --bg:#f7efe9; --panel:#fffbf7; --panel2:#faf3ed; --line:#e8d9cf; --line2:#dac6b8;
 --ink:#3e3029; --mut:#917b6f; --leaf:#a36a55; --leaf2:#c48b76; --leafsoft:#f3e5dc;
 --berry:#c2185b; --berry2:#e8417a; --berrysoft:#fbe3ec; --gold:#b1803a; --goldsoft:#f4ead4;
 --cream:#fffbf7; --shadow:rgba(95,65,55,.16); --rowalt:#f9f1ea;
 --chip:#f3e7df; --headbg:#5a3f37; --headtxt:#fdf6f0; --yellow:#fff0c2;
}
/* クリーム系④ セージ：クリーム×ほんのり緑で落ち着き */
[data-theme="sage"]{
 --bg:#f3f1e5; --panel:#fefdf7; --panel2:#f7f5ea; --line:#dfdcc8; --line2:#cecbb0;
 --ink:#363528; --mut:#807f66; --leaf:#6f7a4a; --leaf2:#929c69; --leafsoft:#ecedd6;
 --berry:#bd4f63; --berry2:#d97f8c; --berrysoft:#f5e4e6; --gold:#b08a32; --goldsoft:#f3edd2;
 --cream:#fefdf7; --shadow:rgba(80,80,45,.15); --rowalt:#f7f5e8;
 --chip:#eeecd9; --headbg:#494a30; --headtxt:#fbf9ec; --yellow:#fff0bc;
}
/* クリーム系⑤ モカ・ダーク：クリームの夜版（濃茶ベース） */
[data-theme="mocha"]{
 --bg:#221b13; --panel:#2d251a; --panel2:#352c20; --line:#473a29; --line2:#5a4a35;
 --ink:#f0e6d4; --mut:#b09a7c; --leaf:#d2a566; --leaf2:#e3bd84; --leafsoft:#352a1c;
 --berry:#e8839a; --berry2:#f5a3b5; --berrysoft:#2e1d22; --gold:#e8c547; --goldsoft:#2e2813;
 --cream:#f0e6d4; --shadow:rgba(0,0,0,.5); --rowalt:#332a1e;
 --chip:#352c20; --headbg:#191309; --headtxt:#f0e6d4; --yellow:#3a3216;
}
/* 北欧：青みのクール系 */
[data-theme="nordic"]{
 --bg:#eef2f5; --panel:#ffffff; --panel2:#f6f9fb; --line:#dae3ea; --line2:#c4d2dd;
 --ink:#1e2c36; --mut:#637585; --leaf:#2f6e8c; --leaf2:#4a93b3; --leafsoft:#e3eef3;
 --berry:#c0405f; --berry2:#e0667f; --berrysoft:#f7e4e8; --gold:#b08020; --goldsoft:#f5eed8;
 --cream:#fbfcfd; --shadow:rgba(30,50,70,.15); --rowalt:#f4f8fa;
 --chip:#eaf0f4; --headbg:#1b3140; --headtxt:#eef6fa; --yellow:#fff3c8;
}
/* モノトーン：上品なグレー × 苺アクセント */
[data-theme="mono"]{
 --bg:#f4f4f3; --panel:#ffffff; --panel2:#f8f8f7; --line:#e0e0de; --line2:#cececb;
 --ink:#242422; --mut:#76746f; --leaf:#3a3a37; --leaf2:#5c5c57; --leafsoft:#ececea;
 --berry:#c2185b; --berry2:#e8417a; --berrysoft:#fae0ea; --gold:#9a7b2e; --goldsoft:#f2ecda;
 --cream:#fcfcfb; --shadow:rgba(20,20,18,.14); --rowalt:#f6f6f5;
 --chip:#eeeeec; --headbg:#1f1f1d; --headtxt:#f4f4f2; --yellow:#fdf0bf;
}
/* 濃紺：落ち着いたダーク */
[data-theme="midnight"]{
 --bg:#0f1420; --panel:#19202f; --panel2:#1f2738; --line:#2e384c; --line2:#3c4760;
 --ink:#e4e9f2; --mut:#8a96ac; --leaf:#5b8def; --leaf2:#7aa6f5; --leafsoft:#1a2336;
 --berry:#f06595; --berry2:#ff85ad; --berrysoft:#2a1a26; --gold:#e8c547; --goldsoft:#2a2613;
 --cream:#eef2f8; --shadow:rgba(0,0,0,.55); --rowalt:#1d2536;
 --chip:#1f2738; --headbg:#0a0e18; --headtxt:#e4e9f2; --yellow:#3a3410;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--bg);color:var(--ink);
 transition:background .4s,color .4s;min-height:100vh;
 background-image:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--leaf2) 8%,transparent),transparent 42%),
  radial-gradient(circle at 88% 92%,color-mix(in srgb,var(--berry) 6%,transparent),transparent 46%);}
.app{max-width:1280px;margin:0 auto;padding:0 18px 70px;}
header{padding:26px 0 18px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;}
h1{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:25px;letter-spacing:.04em;color:var(--ink);}
.tagline{font-size:11px;color:var(--mut);letter-spacing:.24em;text-transform:uppercase;margin-top:4px;}
.theme-tog{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--panel);
 border:1px solid var(--line);border-radius:30px;padding:6px 8px;box-shadow:0 6px 18px -10px var(--shadow);}
.theme-tog button{border:none;background:transparent;cursor:pointer;font-size:13px;padding:7px 14px;
 border-radius:20px;color:var(--mut);font-family:inherit;font-weight:700;transition:.2s;}
.theme-tog{flex-wrap:wrap;max-width:560px;justify-content:flex-end;}
.theme-tog button.on{background:var(--leaf);color:#fff;}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
 background:linear-gradient(150deg,var(--panel),var(--panel2));border:1px solid var(--line);
 border-radius:18px;padding:18px 22px;box-shadow:0 18px 44px -26px var(--shadow);margin-bottom:18px;}
.fld{display:flex;flex-direction:column;gap:6px;}
.fld label{font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;font-weight:700;}
select{font-family:inherit;background:var(--panel);border:1.5px solid var(--line2);color:var(--ink);
 padding:10px 14px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.2s;}
select:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 22%,transparent);}
.park-sel{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:17px;color:var(--leaf);min-width:210px;}
.stats{display:flex;gap:11px;margin-left:auto;flex-wrap:wrap;}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px 18px;text-align:right;min-width:118px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--leaf);}
.stat.berry::before{background:var(--berry);} .stat.gold::before{background:var(--gold);}
.stat .k{font-size:9.5px;letter-spacing:.13em;color:var(--mut);text-transform:uppercase;font-weight:700;}
.stat .v{font-family:"Spline Sans Mono",monospace;font-size:20px;font-weight:700;color:var(--ink);margin-top:2px;}
.stat .v small{font-size:11px;color:var(--mut);font-weight:500;}
.stat.berry .v{color:var(--berry);} .stat.gold .v{color:var(--gold);}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-1px;position:relative;z-index:2;}
.tab{padding:10px 15px;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:11px 11px 0 0;
 background:var(--chip);color:var(--mut);border:1px solid var(--line);border-bottom:none;transition:.2s;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--leaf);}
.tab.active{background:var(--panel);color:var(--leaf);box-shadow:0 -3px 0 var(--leaf) inset;}
.tab .mini{font-size:8.5px;background:var(--berry);color:#fff;padding:1px 6px;border-radius:8px;letter-spacing:.03em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0 16px 16px 16px;
 box-shadow:0 20px 50px -30px var(--shadow);overflow:hidden;}
.card-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.card-head h2{font-family:"Zen Old Mincho",serif;font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;}
.card-head h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--berry);box-shadow:0 0 9px var(--berry);}
.card-head .meta{font-size:12px;color:var(--mut);margin-left:auto;}
.tablewrap{overflow:auto;max-height:62vh;}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
th{position:sticky;top:0;background:var(--headbg);color:var(--headtxt);font-size:10px;letter-spacing:.08em;
 text-transform:uppercase;font-weight:700;padding:12px 13px;text-align:left;white-space:nowrap;z-index:3;}
th.r{text-align:right;}
td{padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;}
tbody tr:nth-child(even) td{background:var(--rowalt);}
tbody tr:hover td{background:color-mix(in srgb,var(--leaf) 8%,transparent);}
.name{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:15px;color:var(--ink);}
.cls{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--leaf);letter-spacing:.03em;}
.waku{font-size:12.5px;color:var(--mut);} .koza{font-size:12.5px;color:var(--mut);}
.num{font-family:"Spline Sans Mono",monospace;text-align:right;font-weight:600;color:var(--ink);}
.num.total{color:var(--leaf);font-size:15px;font-weight:700;}
.num.minus{color:var(--berry);} .num.zero{color:var(--mut);font-weight:400;}
.ptag{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;letter-spacing:.03em;display:inline-block;}
.pt-月寒園{background:#e8f0e9;color:#3d7355;}
.pt-白石園{background:#eef0f5;color:#4a5a82;}
.pt-サッポロファクトリー園{background:#f7e7ec;color:#a8466a;}
.pt-幼稚舎{background:#f5ecdc;color:#9a6b2f;}
.pt-資生館保育園{background:#ece7f2;color:#6a548c;}
[data-theme="dark"] .pt-月寒園,[data-theme="midnight"] .pt-月寒園,[data-theme="mocha"] .pt-月寒園{background:#1d3326;color:#7cc99a;}
[data-theme="dark"] .pt-白石園,[data-theme="midnight"] .pt-白石園,[data-theme="mocha"] .pt-白石園{background:#1f2740;color:#8fa6d8;}
[data-theme="dark"] .pt-サッポロファクトリー園,[data-theme="midnight"] .pt-サッポロファクトリー園,[data-theme="mocha"] .pt-サッポロファクトリー園{background:#3a1f2a;color:#e88aa8;}
[data-theme="dark"] .pt-幼稚舎,[data-theme="midnight"] .pt-幼稚舎,[data-theme="mocha"] .pt-幼稚舎{background:#3a2e1a;color:#e0b46a;}
[data-theme="dark"] .pt-資生館保育園,[data-theme="midnight"] .pt-資生館保育園,[data-theme="mocha"] .pt-資生館保育園{background:#2a2438;color:#b59ad8;}
.flagdot{color:var(--berry);font-weight:700;font-size:15px;}
tr.changed td{background:color-mix(in srgb,var(--gold) 14%,transparent)!important;}
tr.changed:hover td{background:color-mix(in srgb,var(--gold) 22%,transparent)!important;}
.chgmark{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em;margin-right:6px;}
.reason{font-size:11px;color:var(--berry);}
[contenteditable]{cursor:text;border-radius:5px;}
[contenteditable]:focus{outline:2px solid var(--leaf);outline-offset:1px;background:color-mix(in srgb,var(--leaf) 10%,transparent);}
.inp{font-family:inherit;background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:7px 9px;border-radius:8px;font-size:13px;width:100%;}
.inp:focus{outline:none;border-color:var(--leaf);}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center;}
.btn{font-family:inherit;font-weight:700;font-size:14px;border:none;padding:13px 26px;border-radius:12px;
 cursor:pointer;letter-spacing:.03em;transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:linear-gradient(120deg,var(--leaf),var(--leaf2));color:#fff;box-shadow:0 12px 26px -12px var(--leaf);}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2);}
.hint{font-size:12px;color:var(--mut);line-height:1.7;margin-top:14px;}
.editbadge{font-size:11px;color:var(--gold);font-weight:700;}
/* settings panel */
.setgrid{padding:20px 22px;display:grid;gap:22px;}
.setblock h3{font-family:"Zen Old Mincho",serif;font-size:15px;color:var(--leaf);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.bankcol th:first-child{text-align:left;}
.yellow{background:var(--yellow);}
/* PDF preview */
.pdfpaper{background:var(--cream);color:#1a1a1a;max-width:600px;margin:22px auto;padding:40px 46px;
 border-radius:8px;box-shadow:0 20px 50px -20px var(--shadow);font-family:"Zen Old Mincho",serif;line-height:1.9;}
[data-theme="dark"] .pdfpaper{color:#1a1a1a;}
.pdfpaper h3{text-align:center;font-size:20px;letter-spacing:.3em;margin:18px 0;border-bottom:2px solid #2f6b46;padding-bottom:10px;}
.pdfpaper .sec{font-weight:700;color:#2f6b46;border-left:4px solid #2f6b46;padding-left:8px;margin:18px 0 8px;}
.pdfpaper table{font-family:"Zen Kaku Gothic New";font-size:13px;}
.pdfpaper td{border:none;padding:5px 8px;color:#333;background:none!important;}
.readme{padding:22px 26px;font-size:13.5px;line-height:1.95;white-space:pre-wrap;}
.readme b{color:var(--leaf);}
.foot{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.05em;margin-top:34px;}
@media print{
 body.printing-reissue *{visibility:hidden!important;}
 body.printing-reissue #reissueDoc,body.printing-reissue #reissueDoc *{visibility:visible!important;}
 body.printing-reissue #reissueDoc{position:absolute;left:0;top:0;width:100%;margin:0!important;box-shadow:none!important;border:none!important;}
 body.printing-reissue .noprint{display:none!important;}
 @page{margin:12mm;}
}
</style></head>
<body data-theme="rose">
<div class="app">
<header>
 <div class="brand"><h1>STRAWBERRY FIELD 月謝管理</h1>
  <div class="tagline">Multi-Garden Tuition System</div></div>
 <div class="theme-tog" id="themeTog"></div>
</header>
<div class="controls">
 <div class="fld"><label>現在の園 / Garden</label><select class="park-sel" id="park"></select></div>
 <div class="fld"><label>対象年</label><select id="yy"><option>2026</option><option>2027</option></select></div>
 <div class="fld"><label>対象月</label><select id="mm"></select></div>
 <div class="stats" id="stats"></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="card">
 <div class="card-head"><h2><span class="dot"></span><span id="cardTitle"></span></h2><span class="meta" id="cardMeta"></span></div>
 <div id="body"></div>
 <div id="confirmOverlay" style="display:none;position:fixed;inset:0;background:rgba(20,12,16,.45);z-index:10010;align-items:center;justify-content:center;backdrop-filter:blur(2px)">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:380px;width:90%;padding:28px 26px 22px;box-shadow:0 12px 48px rgba(0,0,0,.25);text-align:center">
   <div id="confirmTitle" style="font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px">確認</div>
   <div id="confirmMsg" style="font-size:13.5px;color:var(--mut);line-height:1.8;margin-bottom:22px;white-space:pre-line"></div>
   <div id="confirmExtra" style="margin-bottom:22px"></div>
   <div style="display:flex;gap:10px;justify-content:center">
    <button id="confirmCancel" style="padding:10px 24px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:24px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600">キャンセル</button>
    <button id="confirmOK" style="padding:10px 24px;border:none;background:var(--berry);color:#fff;border-radius:24px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600">削除する</button>
   </div>
  </div>
 </div>
</div>
<div class="actions">
 <button class="btn btn-primary" onclick="exportXlsx()">📊 スプレッドシート(xlsx)に出力</button>
 <button class="btn btn-ghost" id="addBtn" onclick="addAction()"></button>
 <span class="editbadge" id="editBadge"></span>
</div>
<div class="hint" id="hint"></div>
<div class="foot">STRAWBERRY FIELD Children's Garden ／ ハイアイランド株式会社　—　月謝管理アプリ（方式B連動版）</div>

function ymKey(){return yy+'-'+mm;}

function prevYmKey(){let py=yy,pm=mm-1;if(pm<1){pm=12;py=yy-1;}return py+'-'+pm;}
// イベント出納帳：前月から繰り越されたイベント予算の残金（当園）。なければ0。
// 前月のイベント出納帳が「翌月へ繰り越す」で締められていれば、その eventCarry を当月の開始繰越金とする。
function cbEventCarryIn(){
 const pk=park;const pkey=prevYmKey();
 const prev=cashbookEvent[pk]&&cashbookEvent[pk][pkey];
 if(!prev)return 0;
 // 前月が締め済み（繰越行 or 締め行あり）で eventCarry>0 のときのみ繰り越す
 const closed=(prev.rows||[]).some(r=>r.isClose);
 return closed?(Number(prev.eventCarry)||0):0;
}
function logChange(name,field,label,fromVal,toVal){
 const k=ymKey();
 if(!changeLog[k])changeLog[k]={};
 if(!changeLog[k][name])changeLog[k][name]=[];
 let arr=changeLog[k][name];
 // 同じfieldの既存ログは置き換え
 arr=arr.filter(x=>x.field!==field);
 // 基準値（rosterBase）と同じに戻ったら記録しない
 const base=rosterBase.find(x=>x.name===name);
 const baseVal=base?base[field]:undefined;
 if(toVal!==baseVal){arr.push({field,label,from:baseVal,to:toVal});}
 changeLog[k][name]=arr;
 if(arr.length===0)delete changeLog[k][name];
}

function eventsFor(p){let out=[];sched.forEach(s=>{
 if(s.state!=='確定'||s.year!=yy||s.month!=mm)return;const amt=s.fix||0;if(!amt)return;
 // 除外園児に含まれていればスキップ
 if(s.exclude&&s.exclude.includes(p.name))return;
 let hit=false;
 if(s.cls==='全員'||s.cls==='全園')hit=true;

 else if(M.facilities.some(f=>f.name===s.cls)){if(s.cls===p.park)hit=true;} // 施設対象（幼稚舎など）

 if(t==='B'){ // 幼稚舎：バスのみ（バスはcalc内で別途加算するためここでは扱わない）

function calc(p,asNyuenMonth){

 const evSum=allOpt.reduce((a,e)=>a+e.amt,0);

 // 非課税世帯：無償化対象。保育料・教材費・手数料・割引など基本部分は0、オプション（台帳OP・追加申込み・イベント費）のみ請求
 if(p.waku==='非課税世帯'){
  return {type:t,getsu:0,kyozai:0,sib:0,half:0,evs:allOpt,evSum,sub:evSum,fee:0,total:evSum,flag:allOpt.length>0,changed:false,reason:['非課税世帯（無償化）'].concat(allOpt.map(e=>'OP:'+e.item)).join(' / '),isNew:false,muso:true};
 }

 if(t==='B'){ // 幼稚舎：授業料 + 付帯費(内訳合算) + レッスン費 + 給食 + 冷暖房 + バス + 給食実費 - 早割

  else if(hasOverride){jugyo=+p.jugyoOverride||0;}

  const fb=Y.futai_breakdown||{};

  const fee=(sub===0)?0:tesu;
  const total=sub+fee;
  const flag=allOpt.length>0||mealAmt>0||early!==0;
  const changed=(bus!==0)||allOpt.length>0||mealAmt>0||early!==0;
  let reason=[];if(bus)reason.push('バス');if(early)reason.push(`早割(${earlyTag})`);if(isEmployeeB)reason.push(isHoikushi?'従業員割引(保育士)':'従業員割引');allOpt.forEach(e=>reason.push('OP:'+e.item));
  if(mealAmt>0)reason.push(`給食実費(${mf.tag} 昼${mf.lunch}/パン${mf.bread})`);
  return {type:'B',getsu,kyozai,sib:0,half:0,bus,early,evs:allOpt,evSum,mealAmt,mf,sub,fee,total,flag,changed,reason:reason.join(' / '),isNew:false,
   _detail:{授業料:jugyo,付帯費:futai,レッスン:lesson,給食:kyushoku,冷暖房:reidanbo,バス:bus,給食実費:mealAmt,早割:early,手数料:fee}};
 }
 if(t==='C'){ // 資生館：3-5歳は無償(副食4500のみ)、0-2歳は30000/兄弟15000
  const S=M.shiseikan;

  }else{ // 0-2歳（年齢差なし・一律）
   let base = S.age02[p.waku] || S.age02['地域枠'];

   const flag=(hasSibling(p)&&!isEmployeeC)||allOpt.length>0;
   const changed=(hasSibling(p)&&!isEmployeeC)||allOpt.length>0; // 兄弟割引・OP・イベントがあれば変動
   let reason=[];if(hasSibling(p)&&!isEmployeeC)reason.push('兄弟割引(¥15,000)');if(isEmployeeC)reason.push(p.waku==='従業員(保育士)'?'従業員割引(保育士)':'従業員割引');allOpt.forEach(e=>reason.push('OP:'+e.item));
   return {type:'C',getsu:dispGetsu,kyozai:dispKyozai,sib,half:0,evs:allOpt,evSum,sub,fee:tesuC,total,flag,changed,reason:reason.join(' / '),isNew:false};
  }
 }
 // 体系A：保育園3園（既存ロジック）
 const pr=M.prices[p.waku]||{getsu:0,kyozai:0,tesu:0};
 const getsu=pr.getsu||0,kyozai=pr.kyozai||0,tesu=pr.tesu||0;
 // 兄弟割引：従業員枠は対象外（Number9/ハイアイランド/アドバイザー/他園）
 const isEmployee=/^従業員\(/.test(p.waku||'');

 }

 const flag=isNew||allOpt.length>0;

function allPupils(){ // 園児台帳のみ（新規入園は「確定」で台帳に移動する方式）
 return roster.slice();}
const CLS_ORDER=['SEED-0','SEED-1','SPROUT','LEAF','BLOSSOM','HARVEST'];
// 生年月日と対象年度から、その年度の4月2日時点での満年齢→クラスを返す
// 年度: 4月2日〜翌年4月1日（例：2026年度=2026/4/2〜2027/4/1）
// 入園時年齢（生年月日と入園年月日から計算）
function ageAtEnroll(birth,nyuen){
 if(!birth||!nyuen)return null;
 const b=new Date(birth),n=new Date(nyuen);
 if(isNaN(b)||isNaN(n))return null;
 let age=n.getFullYear()-b.getFullYear();
 const m=n.getMonth()-b.getMonth();
 if(m<0||(m===0&&n.getDate()<b.getDate()))age--;
 return age<0?null:age;
}
function classByBirth(birth,yy){
 if(!birth)return '';
 // 対象年度の4月1日終了時点（=4月2日午前0時）の満年齢を求める
 // 「年度の4月1日終了時点で何歳か」を計算（4月1日が誕生日の子は前年度扱い）
 const b=new Date(birth);
 // 基準日：その年度の4月1日（年度の最終日：基準日=年度初日4月1日とすると、誕生日が4月1日の子は前年度扱いになる）
 // 実務的には「4月1日時点で満N歳」=「年度開始時点で満N歳」
 const ref=new Date(yy,3,1); // yy年4月1日
 let age=ref.getFullYear()-b.getFullYear();
 const m=ref.getMonth()-b.getMonth();
 if(m<0||(m===0&&ref.getDate()<b.getDate()))age--;
 if(age<0||age>5)return '';
 return CLS_ORDER[age];
}
let sortMode='ageAsc'; // ageAsc(年齢順 0歳→年長) / ageDesc(年長→0歳) / kana(五十音) / regist(登録順) / class(クラス順)
let wakuFilter='すべて'; // すべて / 地域枠 / 企業提携枠 / 旧企業枠 / 従業員(Number9) / 従業員(ハイアイランド) / 地域無償化
let clsFilter='すべて'; // すべて / SEED-0 / SEED-1 / SPROUT / LEAF / BLOSSOM / HARVEST
let monthlyPayFilter='すべて'; // すべて / 振込のみ / 再請求のみ（月次計算タブの絞り込み）
function visible(){
 let list=allPupils().filter(r=>park==='全施設'||r.park===park);
 // 未確定の新規入園は、台帳・月次計算・ルクミー・集計には表示しない（新規入園タブでのみ扱う）
 list=list.filter(r=>!(r.isNew&&!r.confirmed));
 if(wakuFilter!=='すべて')list=list.filter(r=>r.waku===wakuFilter);
 if(clsFilter!=='すべて')list=list.filter(r=>r.cls===clsFilter);
 if(sortMode==='regist')return list; // 登録順（並び替えなし）
 return list.slice().sort((a,b)=>{
  // 全施設のときは施設ごとにまとめる
  if(park==='全施設'){
   const pa=M.facilities.findIndex(f=>f.name===a.park);
   const pb=M.facilities.findIndex(f=>f.name===b.park);
   if(pa!==pb)return pa-pb;
  }
  if(sortMode==='kana'){
   return (a.name||'').localeCompare(b.name||'','ja');
  }
  // クラス順（SEED-0 → HARVEST、同クラス内は五十音）
  if(sortMode==='class'){
   const ca=CLS_ORDER.indexOf(a.cls), cb=CLS_ORDER.indexOf(b.cls);
   const ka=ca<0?99:ca, kb=cb<0?99:cb;
   if(ka!==kb)return ka-kb;
   return (a.name||'').localeCompare(b.name||'','ja');
  }
  // 年齢順
  const ca=CLS_ORDER.indexOf(a.cls), cb=CLS_ORDER.indexOf(b.cls);
  const ka=ca<0?99:ca, kb=cb<0?99:cb;
  const diff = (sortMode==='ageDesc')? (kb-ka) : (ka-kb);
  if(diff!==0)return diff;
  return (a.name||'').localeCompare(b.name||'','ja');
 });
}

}

// 会計年度：4月〜翌3月。yy/mm から対象年度を算出（1〜3月は前年が年度）
function hqFiscalYearOf(y,m){ return (m>=4)?y:(y-1); }
function hqCurFY(){ return hqFiscalYearOf(yy,mm); }
// 年度の月順（4,5,…,12,1,2,3）と、その月が属する暦年を返す
function hqFyMonths(fy){
 const arr=[];
 for(let m=4;m<=12;m++)arr.push({m,cy:fy});
 for(let m=1;m<=3;m++)arr.push({m,cy:fy+1});
 return arr;
}
// 年度収支データ：施設×月の {income, expense}（収入＝新規入園振込＋タイムリー現金、支出＝通常経費＋イベント費）
function hqFiscalData(fy){
 const allpks=['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'];
 const months=hqFyMonths(fy);
 // 施設別・月別の器を用意：cell[park][monthIndex] = {shokai,timely,exp,evexp}
 const data={};
 allpks.forEach(p=>{data[p]=months.map(()=>({shokai:0,timely:0,exp:0,evexp:0}));});
 // 月インデックスの逆引き：'cy-m' → index
 const idxOf={};
 months.forEach((mo,i)=>{idxOf[mo.cy+'-'+mo.m]=i;});
 // ① 新規入園（振込）：initSaleLog の paidDate（入金日）の年月で配賦
 roster.filter(r=>r.isNew&&r.name).forEach(p=>{
  const log=initSaleLog[p.name];
  if(!log||!log.paid||!log.paidDate)return;
  const m=String(log.paidDate).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return;
  const cy=+m[1],cm=+m[2];
  const idx=idxOf[cy+'-'+cm];if(idx==null)return;
  if(!data[p.park])return;
  const amt=initSaleAmount(p);if(!(amt>0))return;
  data[p.park][idx].shokai+=amt;
 });
 // ② タイムリー（現金）／③ 通常経費／④ イベント費：[施設][cy-cm] キーで拾う
 allpks.forEach(p=>{
  months.forEach((mo,i)=>{
   const key=mo.cy+'-'+mo.m;
   // タイムリー現金売上
   const tl=(timelyData[p]&&timelyData[p][key])||[];
   tl.forEach(r=>{data[p][i].timely+=Number(r.amt)||0;});
   // 通常経費（出金）：本部振替・現金補充・締めの預金振替は除外
   const cb=(cashbook[p]&&cashbook[p][key]);
   if(cb&&Array.isArray(cb.rows)){
    cb.rows.forEach(r=>{if(r.kind==='out'&&!r.isClose)data[p][i].exp+=Number(r.amt)||0;});
   }
   // イベント費（出金）：締め行・繰越行は除外
   const ev=(cashbookEvent[p]&&cashbookEvent[p][key]);
   if(ev&&Array.isArray(ev.rows)){
    ev.rows.forEach(r=>{if(r.kind==='out'&&!r.isClose)data[p][i].evexp+=Number(r.amt)||0;});
   }
  });
 });
 return {fy,months,data,parks:allpks};
}
// ===== 消費税区分の集計（会計士確認用）=====
// 当月（yy/mm）の請求を施設別に課税（制服代）／非課税（月謝・保育料等）／行事その他に分ける
function hqTaxBreakdown(y,m){
 const allpks=['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'];
 const savedY=yy,savedM=mm;yy=y;mm=m; // calc/addonsFor が参照するグローバルを一時切替
 const res={};
 allpks.forEach(p=>{res[p]={taxable:0,nontaxUni:0,nontax:0,other:0,total:0};});
 allPupils().forEach(r=>{
  if(!res[r.park])return;
  const c=calc(r);
  if(!(r.status==='在園中'||c.isNew))return;
  // 非課税：月謝・保育料・付帯費・割引・日割り・手数料・早期割引
  const nontax=c.getsu+c.kyozai+c.sib+c.half+(c.early||0)+c.fee;
  res[r.park].nontax+=nontax;
  res[r.park].total+=c.total;
  // 課税＝単体購入の制服（addonTaxable）のみ。月謝と一括の制服・レンタル・初回オプションは非課税（制服）。
  // それ以外（行事費・用品等）は「行事/その他」。
  c.evs.forEach(e=>{
   if(e.addonTaxable){ res[r.park].taxable+=e.amt; }          // 単体購入の制服＝課税
   else if(isUniform(e.item)){ res[r.park].nontaxUni+=e.amt; } // 月謝一括・レンタル等の制服＝非課税（制服）
   else { res[r.park].other+=e.amt; }                          // 行事費・その他用品
  });
 });
 yy=savedY;mm=savedM; // 復元
 return res;
}
// 年度（4月〜翌3月）の月別 課税売上（制服代）と非課税売上を施設別に集計
function hqTaxByMonth(fy){
 const allpks=['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'];
 const months=hqFyMonths(fy);
 const data={};
 allpks.forEach(p=>{data[p]=months.map(()=>({taxable:0,nontaxUni:0,nontax:0,other:0}));});
 months.forEach((mo,i)=>{
  const bd=hqTaxBreakdown(mo.cy,mo.m);
  allpks.forEach(p=>{data[p][i]={taxable:bd[p].taxable,nontaxUni:bd[p].nontaxUni,nontax:bd[p].nontax,other:bd[p].other};});
 });
 return {fy,months,data,parks:allpks};
}

 const {months,data}=hqFiscalData(fy);
 const rows=[];
 rows.push([`${fy}年度 収支まとめ（${fy}年4月〜${fy+1}年3月）`]);
 rows.push(['※収入＝新規入園（振込）＋タイムリー（現金）。月謝は別管理のため含まず。支出＝現金出納帳＋イベント出納帳の出金。']);
 rows.push([]);

 rows.push(['施設','収入合計','うち新規入園','うちタイムリー','支出合計','うち経費','うちイベント費','年度収支']);
 let G={shokai:0,timely:0,exp:0,evexp:0};
 pks.forEach(p=>{
  const t=data[p].reduce((a,c)=>({shokai:a.shokai+c.shokai,timely:a.timely+c.timely,exp:a.exp+c.exp,evexp:a.evexp+c.evexp}),{shokai:0,timely:0,exp:0,evexp:0});
  G.shokai+=t.shokai;G.timely+=t.timely;G.exp+=t.exp;G.evexp+=t.evexp;
  rows.push([p,t.shokai+t.timely,t.shokai,t.timely,t.exp+t.evexp,t.exp,t.evexp,(t.shokai+t.timely)-(t.exp+t.evexp)]);

 rows.push([]);

 rows.push([`月別推移（${park==='全施設'?'全施設合算':park}）`]);

 rows.push(['収入',...mInc,mInc.reduce((a,b)=>a+b,0)]);
 rows.push(['支出',...mOut,mOut.reduce((a,b)=>a+b,0)]);

// 戻り値は {date, acctName, tax, tekiyo, inn, out, dnum} の配列（残高は呼び出し側で通し計算）。
// 売上（新規入園振込・タイムリー現金）は通常側のみ。月謝は別管理のため含めない。
function cbCollectMfRows(){
 const bumon=CB_BUMON[park]||park;
 const items=[];
 const dnum=(mo,day)=>day?((+mo)*100+(+day)):0; // 日なし（繰越・本部振替）は先頭へ
 const ds=(mo,day)=>day?`${yy}/${mo}/${day}`:`${yy}/${mm}/1`;
 const add=(mo,day,acctName,tax,tekiyo,inn,out,order)=>{
   items.push({date:ds(mo,day),acctName,tax,tekiyo,inn:inn||0,out:out||0,dnum:dnum(mo,day),order:order||0});
 };
 // 通常・イベントの両帳簿を回す（cbModeに依存せず直接取得）
 [cbStoreGet(cashbook), cbStoreGet(cashbookEvent)].forEach((cb,idx)=>{
   const isEv=idx===1;
   // イベント側：前月から繰り越したイベント残金（手元に残っている現金）を先頭の繰越金として計上
   if(isEv){
     const carryIn=cbEventCarryIn();
     if(carryIn>0){
       add(mm,1,'本部より振替','対象外','イベント費 前月繰越',carryIn,0,-1);
     }
   }
   // 本部より振替（イベントはイベント予算）。order=0で日付先頭に置く
   if((Number(cb.opening)||0)>0){
     add(mm,1,'本部より振替','対象外',isEv?'イベント予算 振替':'本部から振替',Number(cb.opening)||0,0,-1);
   }
   (cb.rows||[]).forEach(r=>{
     const mo=(r.mon!=null&&r.mon!=='')?r.mon:mm;
     // 現金入金（補充）
     if(r.isCash&&r.kind==='in'&&!r.isClose){
       add(mo,r.day,'本部より振替',(r.tax||'対象外'),isEv?'イベント費 現金補充':'現金入金（補充）',Number(r.amt)||0,0);return;
     }
     // 締めの預金振替（出金）。繰越（carry, amt=0）は帳簿に出さない
     if(r.isClose){
       if(r.carry)return; // 翌月繰越：現金箱から出ていないので行を出さない
       add(mo,r.day,'本部より振替','対象外',isEv?'イベント予算 預金振替':'預金振替',0,Number(r.amt)||0,9);return;
     }
     // 経費（出金）
     if(r.kind==='out'){
       const a=CB_ACCT_BY[+r.acct];
       add(mo,r.day,a?a.name:'',r.tax||(a&&a.tax)||'',`${r.shop||''}${r.shop&&r.item?'　':''}${r.item||''}`,0,Number(r.amt)||0);return;
     }
   });
 });
 // 売上（通常側のみ）：新規入園（振込）・タイムリー（現金）
 const cbN=cbStoreGet(cashbook);
 shokaiAutoRowsFor(false).forEach(r=>{const mo=(r.mon!=null&&r.mon!=='')?r.mon:mm;add(mo,r.day,'保育園収入高','非課税売上',`【振込】${r.item||''}`,Number(r.amt)||0,0);});
 (timelyData[park]&&timelyData[park][ymKey()]||[]).forEach(r=>{add((r.mon||mm),r.day,'保育園収入高','非課税売上',`【現金】${r.item||''}`,Number(r.amt)||0,0);});
 // 日付順（order→dnum）で安定ソート
 items.sort((a,b)=>(a.order-b.order)||(a.dnum-b.dnum));
 return items;
}

 // 繰越金（4行目）：本物テンプレートでは残高欄は空（=0扱い）。本部より振替の行で残高が立つ
 set('K4','繰越金');set('N4',0);
 // 名称→コードの対応（勘定科目コードを直接入れる。数式を使わないので▲が一切出ない）
 const MF_CODE_BY_NAME={};MF_ACCTS.forEach(([code,name])=>{MF_CODE_BY_NAME[name]=code;});
 // データ行（5行目〜）：通常出納帳＋イベント出納帳を合算した明細を日付順に出力。残高は通し計算。

// 当月の出納帳を「売上」と「支出」に分けて取り出す（タイムリーはプレビュー読込分も合算）
function cbSplitData(cb){
 const bumon=CB_BUMON[park]||park;
 const sales=[],expenses=[];
 let cashAddNormal=0,cashAddEvent=0; // 通常の補充入金／イベント費予算の入金
 cbAllRows(cb).forEach(r=>{
   const mo=(r.mon!=null&&r.mon!=='')?r.mon:mm;
   const date=r.day?`${yy}/${mo}/${r.day}`:'';
   if(r.isClose)return; // 預金振替（締め行）は除く
   if(r.isCash&&r.kind==='in'){ // 現金入金（補充／イベント予算）
     if(r.evBudget)cashAddEvent+=Number(r.amt)||0; else cashAddNormal+=Number(r.amt)||0;
     return;
   }
   if(r.kind==='out'){ // 支出（経費）
     const a=CB_ACCT_BY[+r.acct];
     expenses.push({date, acct:a?a.name:'', tax:r.tax||'', shop:r.shop||'', item:r.item||'', amt:Number(r.amt)||0, by:r.by||'', event:!!r.event});
   }
 });
 // 新規入園（振込売上）
 cbShokaiRows(cb).forEach(r=>{
   const mo=(r.mon!=null&&r.mon!=='')?r.mon:mm;
   sales.push({date:r.day?`${yy}/${mo}/${r.day}`:'', kubun:'振込', item:r.item||'', amt:Number(r.amt)||0, by:r.by||''});
 });
 // タイムリー現金売上（プレビュー内で読み込んだ分）
 (cbTimelyGet()||[]).forEach(r=>{
   sales.push({date:r.day?`${yy}/${r.mon||mm}/${r.day}`:'', kubun:'現金', item:r.item||'', amt:Number(r.amt)||0, by:r.by||''});
 });
 // 日付順（月→日の数値順）に並べる
 const dnum=s=>{const m=String(s.date||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?(+m[2])*100+(+m[3]):9999;};
 sales.sort((a,b)=>dnum(a)-dnum(b));
 return {sales, expenses, bumon, cashAddNormal, cashAddEvent};
}
// MF出力と同じ並び・項目のプレビュー行（通常＋イベント合算・日付順・残高つき）
function cbMfRows(cb){
 const items=cbCollectMfRows();
 let bal=0;
 return items.map(it=>{bal=bal+(it.inn||0)-(it.out||0);return Object.assign({},it,{bal});});
}

function salesRowsForPark(pk){
 // タイムリー：プレビュー内で読み込んだ timelyData[施設][対象月]
 const out=[];
 const k=ymKey();
 const tl=(timelyData[pk]&&timelyData[pk][k])?timelyData[pk][k]:[];
 tl.forEach(r=>{out.push({mon:r.mon||mm,day:r.day||'',kind:'現金',item:r.item||'',amt:Number(r.amt)||0,by:r.by||'',park:pk});});
 // 新規入園：初回売上管理で入金済み・入金日が対象年月の園児
 roster.filter(r=>r.isNew&&r.name&&r.park===pk).forEach(p=>{
   const log=initSaleLog[p.name];if(!log||!log.paid)return;
   const m=String(log.paidDate||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!m)return;

 out.sort((a,b)=>(a.day||0)-(b.day||0));
 return out;
}

// CSVテキストを行配列にパース（ダブルクオート対応・BOM除去）
function parseCsv(text){
 text=text.replace(/^\ufeff/,'');
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
   if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
   else{ if(c==='"')q=true;
     else if(c===','){row.push(cur);cur='';}
     else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
     else if(c==='\r'){}
     else cur+=c; }
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

// 日付文字列から「月」「日」を取り出す（"2026/6/3"・"6/3"・"6月3日"等に対応）
function cbParseDate(s){
 s=String(s||'').trim();
 const m=s.match(/(?:(\d{4})[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})/);
 if(m)return{mon:+m[2],day:+m[3]};
 return null;
}
function downloadCsv(filename, rows){
 const esc=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
 const body=rows.map(r=>r.map(esc).join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

 allPupils().forEach((r,i)=>ros.push([i+1,r.status,r.waku,r.cls,r.name,r.sib,r.koza,r.lid,r.nyuen,r.park,yn(r.optMattress),yn(r.optBus),yn(r.optDiaper),yn(r.optKnit),yn(r.optCap),yn(r.optParka)]));add('園児台帳',ros);

 visible().forEach(r=>{const c=calc(r);const chg=changesFor(r);m.push([r.park,r.cls,r.waku,r.name,c.getsu,c.kyozai,c.sib,c.half,c.early||0,c.evSum,c.fee,c.total,chg.length?'変動':'',chg.length?chg.map(x=>x.label).join('、'):(c.flag?c.reason:'')]);});add('月次計算',m);
 const l=[['園児ID','クラス','園児名','月極保育料金名称','単価','オプション名称1','オプション小計1','請求金額','変動']];
 visible().filter(r=>r.status==='在園中'||calc(r).isNew).forEach(r=>{const c=calc(r);const base=c.getsu+c.kyozai+c.sib+c.half+(c.early||0);const e0=c.evs[0];const chg=changesFor(r);l.push([r.lid,r.cls,r.name,'月謝（'+r.waku+'）',base,e0?e0.item:'',e0?e0.amt:'',c.total,chg.length?'変動':'']);});add('ルクミー出力',l);
 const hq=[['施設','在園数','請求合計','うち月謝系','うち制服代','うち行事/その他']];let gt=0,gc=0;['月寒園','白石園','サッポロファクトリー園','幼稚舎','資生館保育園'].forEach(p=>{let cnt=0,tot=0,base=0,uni=0,ev=0;allPupils().filter(r=>r.park===p).forEach(r=>{const c=calc(r);if(r.status==='在園中'||c.isNew){cnt++;tot+=c.total;base+=c.getsu+c.kyozai+c.sib+c.half+(c.early||0)+c.fee;c.evs.forEach(e=>{if(isUniform(e.item))uni+=e.amt;else ev+=e.amt;});}});gt+=tot;gc+=cnt;hq.push([p,cnt,tot,base,uni,ev]);});hq.push(['全施設合計',gc,gt,'','','']);add('本部用集計',hq);
 const nw=[['状態','所属園','園児名','フリガナ','枠区分','クラス','口座名義','入園年月日']];roster.filter(r=>r.isNew).sort((a,b)=>(a.regSeq||0)-(b.regSeq||0)).forEach(n=>nw.push([n.confirmed?'確定済':'未確定',n.park,n.name,n.kana||'',n.waku,n.cls,n.koza,n.nyuen]));add('新規入園',nw);
 const ad=[['園児名','商品/項目','サイズ','数量','単価','小計','反映年','反映月']];addons.forEach(a=>ad.push([a.name,a.goods,a.size,a.qty,a.price,(a.price||0)*(a.qty||0),a.ry,a.rm]));add('追加申込み',ad);
 const ml=[['日付','園児名','昼食','パン','金額']];meals.forEach(r=>ml.push([r.date,r.name,r.lunch?'○':'',r.bread?'○':'',(r.lunch?M.mealfee.lunch:0)+(r.bread?M.mealfee.bread:0)]));add('給食記録',ml);

function tabVisible(k){ if(k==='meals') return (park==='幼稚舎'||park==='全施設'); return true; }
function syncTabs(){const el=document.getElementById('tabs');el.innerHTML='';
 // 非表示タブを開いていたら設定に戻す
 if(!tabVisible(tab))tab='settings';
 TABS.filter(([k])=>tabVisible(k)).forEach(([k,label,live])=>{const t=document.createElement('div');t.className='tab'+(k===tab?' active':'');
  t.innerHTML=label+(live?'<span class="mini">連動</span>':'');t.onclick=()=>{
   if(tab==='lookmee'&&k!=='lookmee'){const bad=lookmeeGuard();if(bad){infoDialog('ルクミー出力で、チェック済みなのに担当者が未設定の園児がいます：\n\n'+bad.join('、')+'\n\n担当者を設定してから移動してください。','移動できません');return;}}
   if(tab==='initsale'&&k!=='initsale'){const bad=initSaleGuard();if(bad){infoDialog('初回売上管理で、入金確認済みなのに担当事務が未設定の園児がいます：\n\n'+bad.join('、')+'\n\n担当事務を選んでから移動してください。','移動できません');return;}}
   if(tab==='cashbook'&&k!=='cashbook'){const bad=cashbookGuard();if(bad){infoDialog('現金出納帳で、入力済みなのに担当が未設定の行があります：\n\n'+bad.join('\n')+'\n\n担当を選んでから移動してください。','移動できません');return;}}

   tab=k;syncTabs();render();};el.appendChild(t);});}
